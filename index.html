<style>

  input.mono { direction: ltr; text-align: left; unicode-bidi: plaintext; }
  .display { font-weight:700; }

  main.app-main { max-width:720px; margin:0 auto; padding:14px 12px 40px; }
  h1,h2,h3,h4 { margin:0; }
  .title { font-size:18px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subtle-link { background:none; border:none; color:#C9D6C6; font-size:11px; padding:0; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .tile .circle { width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .tile-label { font-weight:700; font-size:13.5px; }
  .stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .stat-label { font-size:10.5px; color:var(--inkSoft); display:flex; justify-content:space-between; }
  .stat-value { font-weight:700; font-size:14px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .list-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--line); }
  .list-row:first-child { border-top:none; }
  .flex1 { flex:1; min-width:0; }
  .truncate { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-title { font-weight:600; font-size:14px; }
  .row-sub { font-size:11px; color:var(--inkSoft); }
  input, select, textarea { font-family:inherit; font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  label.field { display:block; margin-bottom:10px; }
  label.field .lbl { display:block; font-size:11.5px; color:var(--inkSoft); margin-bottom:4px; }
  .btn { border:none; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-stamp { background:var(--stampLight); color:var(--stamp); }
  .btn-gold { background:var(--goldLight); color:var(--gold); }
  .btn-ghost { background:var(--paperLight); border:1px solid var(--line); color:var(--inkSoft); }
  .btn-block { width:100%; display:block; text-align:center; }
  .btn-disabled { background:var(--line); color:var(--inkSoft); }
  .row-flex { display:flex; gap:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .search-wrap { position:relative; }
  .search-wrap input { padding-right:34px; }
  .search-icon { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--inkSoft); }

  .product-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:right; cursor:pointer; display:flex; flex-direction:column; gap:6px; }

  .chip { display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; }
  .cart-card { background:var(--paperLight); border:1px solid var(--line); border-radius:10px; margin-top:14px; }
  .cart-head { padding:14px; text-align:center; border-bottom:1px dashed var(--line); position:relative; }
  .cart-items { padding:10px 14px; max-height:220px; overflow-y:auto; }
  .cart-item { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .qty-btn { width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .cart-totals { padding:10px 14px; border-top:1px dashed var(--line); }
  .cart-foot { padding:10px 14px 14px; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; }
  .empty { text-align:center; padding:40px 10px; color:var(--inkSoft); }
  .empty.small { padding:20px 10px; }
  .empty .emoji { font-size:30px; margin-bottom:8px; }
  .section-title { font-size:14px; font-weight:700; margin:16px 0 8px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; } }
  .modal-box { background:var(--paperLight); color:var(--ink); width:100%; max-width:440px; max-height:88vh; overflow-y:auto; overscroll-behavior-y: contain; border-radius:16px 16px 0 0; padding:20px; }
  @media(min-width:640px){ .modal-box{ border-radius:16px; } }
  .modal-title-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .close-x { background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink); }
  .tabbar { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .tab-pill { padding:6px 14px; border-radius:999px; font-size:12px; white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--inkSoft); cursor:pointer; }
  .tab-pill.active { background:var(--green); color:#fff; border-color:var(--green); }
  .toggle { width:40px; height:22px; border-radius:999px; border:none; position:relative; cursor:pointer; }

  .flash { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  .floating-bar { position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--greenDark); color:#fff; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; box-shadow:0 -4px 12px rgba(0,0,0,.2); cursor:pointer; }
  .floating-bar .fb-info { display:flex; flex-direction:column; }
  .floating-bar .fb-count { font-size:11px; color:#C9D6C6; }
  .floating-bar .fb-total { font-size:16px; font-weight:700; font-family:"Courier New",monospace; }

    .no-print { display:none !important; }
    .print-area tr, .print-area .print-row, .print-area .print-card { page-break-inside:avoid; break-inside:avoid; }
    .print-area table { page-break-inside:auto; }
    .print-area thead { display:table-header-group; }
    html, body { height:auto !important; overflow:visible !important; }
  }

      const ri = await db.collection("daftar_repIndex").doc(repEmailOf(u)).get();
      if (ri.exists && ri.data().linkId && ri.data().ownerUid !== u.uid) {
        wipeLocalCompanyData();
        repEnterMode(u, ri.data()); return;
      }
    } catch (e) { console.warn("rep index check skipped", e && e.code); }
    // إذا على الجهاز بيانات شركة شخص ثاني (مثلاً صاحب الشركة فتح من جوال المندوب): بنمسحها من الجهاز وبنكمل كأنه جهاز جديد
    if (localLink && !(snap.exists && snap.data().linkId)) {
      let foreign = false;
      try { const own = await db.collection("daftar_owners").doc(localLink).get(); foreign = own.exists && own.data().uid !== u.uid; }
      catch (e) { foreign = true; }
      if (foreign) {
        wipeLocalCompanyData();
        try { localStorage.setItem(LS_PREFIX + "authUid", u.uid); localStorage.setItem(LS_PREFIX + "authEmail", u.email || ""); } catch (e) {}
        bootDB(); state.activeAccountId = null;
        localLink = null;
      }
    }
    // إذا هالإيميل مضاف كمندوب عند شركة (وما عنده شركة خاصة فيه) — بنفتح التطبيق كمندوب
    if (!(snap.exists && snap.data().linkId) && !localLink) {
      try {
        const ri = await db.collection("daftar_repIndex").doc(repEmailOf(u)).get();
        if (ri.exists && ri.data().linkId) { repEnterMode(u, ri.data()); return; }
      } catch (e) { console.warn("rep index check skipped", e && e.code); }
    }
    if (snap.exists && snap.data().linkId) {
      const linkId = snap.data().linkId;
      if (localLink === linkId) return;
      const hasLocal = ["sales", "purchases", "vouchers", "customers"].some((k) => (DB[k] || []).length > 0);
      if (localLink && hasLocal && !confirm("هالجهاز فيه بيانات شركة ثانية. بدك تبدّلها ببيانات حسابك؟")) return;
      await cloudPullCompany(linkId);
      return;
    }
    if (localLink) {
      // أول مرة: الجهاز أصلًا مربوط بسحابة — بنسجّلها باسم هالحساب (إذا ما حدا سبقه)
      const ownRef = db.collection("daftar_owners").doc(localLink);
      const own = await ownRef.get();
      if (own.exists && own.data().uid !== u.uid) { flash("❌ بيانات هالجهاز مربوطة بحساب ثاني"); return; }
      if (!own.exists) await ownRef.set({ uid: u.uid, email: u.email || "", at: Date.now() });
      await userRef.set({ linkId: localLink, email: u.email || "", at: Date.now() });
      flash("✅ تم ربط بياناتك بحسابك");
    } else {
      // مستخدم جديد: بنعمله سحابة خاصة فيه
      const linkId = uid() + uid();
      await db.collection("daftar_owners").doc(linkId).set({ uid: u.uid, email: u.email || "", at: Date.now() });
      await userRef.set({ linkId, email: u.email || "", at: Date.now() });
      cloudSetLinkId(linkId);
      if (!cloudGetOwnerPin()) cloudSetOwnerPin(String(Math.floor(1000 + Math.random() * 9000)));
      cloudMarkDirty(null, Date.now());
      cloudStartListening();
    }
  } catch (e) {
    console.error("auth link failed", e);
  } finally { authLinking = false; try { repStartInbox(); } catch (e) {} render(); }
}

const BACKUP_KEYS = ["accounts", "products", "suppliers", "customers", "purchases", "sales", "expenses", "vouchers", "manualCash", "checks", "capital", "warehouses", "warehouseEntries", "employees", "employeeTx", "settingsMap", "reps", "cashHandovers", "cloudOwnerPin", "damagedGoods", "issuedChecks"];
function exportBackup() {
  const payload = { app: "daftar", version: 1, exportedAt: new Date().toISOString() };
  BACKUP_KEYS.forEach((k) => { payload[k] = DB[k]; });
  // الصور المحفوظة على الجهاز بتنضاف للنسخة عشان ما تضيع لو غيّرت الجوال
  const photos = {};
  PHOTO_KEYS.forEach((k) => (DB[k] || []).forEach((x) => { if (x && photoIsLocal(x.photo)) { const id = photoLocalId(x.photo); if (PHOTO_CACHE[id]) photos[id] = PHOTO_CACHE[id]; } }));
  if (Object.keys(photos).length) payload.photos = photos;
  const json = JSON.stringify(payload, null, 2);
  const fileName = `daftar-backup-${new Date().toISOString().slice(0, 10)}.json`;
  // داخل تطبيق الأندرويد: التحميل العادي ما بيشتغل، فبنفتح قائمة المشاركة (واتساب، الملفات، درايف...)
  if (window.AndroidShare && window.AndroidShare.shareTextFile) {
    let ok = false;
    try { ok = window.AndroidShare.shareTextFile(fileName, json, "application/json"); } catch (e) { console.error("native share failed", e); }
    if (ok) { flash("اختار وين بدك تحفظ النسخة أو تبعتها"); return; }
    flash("❌ ما قدرت أفتح قائمة المشاركة");
    return;
  }
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash("تم تصدير النسخة الاحتياطية");
}

/* ===== ترقيم المستندات: بيع ب-1، شراء ش-1، قبض ق-1، صرف ص-1 (كل نوع عدّاد خاص لكل حساب) ===== */
const DOC_SERIES = { S: { ar: "ب", en: "S" }, P: { ar: "ش", en: "P" }, R: { ar: "ق", en: "R" }, V: { ar: "ص", en: "V" } };
function docSeriesOf(key, rec) {
  if (key === "sales") return "S";
  if (key === "purchases") return "P";
  if (key === "vouchers") return rec && rec.partyKind === "supplier" ? "V" : "R";
  return null;
}
function docSeriesGuess(rec) {
  if (!rec) return "S";
  if (rec.partyKind) return rec.partyKind === "supplier" ? "V" : "R";
  if (Object.prototype.hasOwnProperty.call(rec, "supplierId")) return "P";
  return "S";
}
function docNextNo(key, series, accountId) {
  let max = 0;
  (DB[key] || []).forEach((x) => { if (x.accountId === accountId && docSeriesOf(key, x) === series && x.no > max) max = x.no; });
  if (REP_MODE) max = Math.max(max, Number(repSeriesMax()[series]) || 0);
  return max + 1;

function ensureDocNumbers() {

    const arr = DB[key] || [];
    const missing = arr.filter((x) => x && !x.no);
    if (!missing.length) return;
    const groups = {};
    missing.forEach((x) => { const g = x.accountId + "|" + docSeriesOf(key, x); (groups[g] = groups[g] || []).push(x); });
    const assigned = {};
    Object.keys(groups).forEach((g) => {
      const [acc, series] = g.split("|");
      let n = docNextNo(key, series, acc);
      groups[g].sort((a, b) => String(a.ts).localeCompare(String(b.ts)) || String(a.id).localeCompare(String(b.id))).forEach((x) => { assigned[x.id + "|" + x.accountId] = n++; });

/* ===== نقل الصور القديمة (روابط السحابة أو صور داخل البيانات) إلى تخزين الجهاز ===== */
const PHOTO_KEYS = ["products", "sales", "purchases", "checks", "warehouseEntries", "expenses", "vouchers"];
let photoMigrationRunning = false;
function blobToDataUrl(blob) {
  return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(blob); });
}
function photoIdFromUrl(url) {
  // نفس الاسم على كل الأجهزة: photos/<link>/<id>.jpg -> c_<id>
  try { const m = decodeURIComponent(url).match(/photos\/[^/]+\/([^/?.]+)/); if (m) return "c_" + m[1]; } catch (e) {}
  let h = 0; for (let i = 0; i < url.length; i++) h = (h * 31 + url.charCodeAt(i)) | 0;
  return "c_" + Math.abs(h).toString(36);
}
async function photoDownload(url) {
  // 1) من خلال التطبيق نفسه (أضمن طريقة على الأندرويد)
  try {
    if (window.AndroidShare && window.AndroidShare.downloadBase64) {
      const b64 = window.AndroidShare.downloadBase64(url);
      if (b64) return "data:image/jpeg;base64," + b64;
    }
  } catch (e) {}
  // 2) Capacitor HTTP
  try {
    const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
    if (H && H.request) {
      const r = await H.request({ url, method: "GET", responseType: "blob" });
      if (r && r.status >= 200 && r.status < 300 && typeof r.data === "string" && r.data) return r.data.startsWith("data:") ? r.data : "data:image/jpeg;base64," + r.data;
    }
  } catch (e) {}
  // 3) المتصفح العادي
  try { const r = await fetch(url); if (r.ok) { const d = await blobToDataUrl(await r.blob()); if (d) return d; } } catch (e) {}
  // 4) صورة + canvas
  return await new Promise((res) => {
    const img = new Image(); img.crossOrigin = "anonymous";
    const t = setTimeout(() => res(null), 25000);
    img.onload = () => { clearTimeout(t); try { const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext("2d").drawImage(img, 0, 0); res(c.toDataURL("image/jpeg", 0.8)); } catch (e) { res(null); } };
    img.onerror = () => { clearTimeout(t); res(null); };
    img.src = url;
  });
}
function photoMigrationPending() {
  let n = 0;
  PHOTO_KEYS.forEach((k) => (DB[k] || []).forEach((x) => {
    if (!x || typeof x.photo !== "string") return;
    if (x.photo.startsWith("http") || x.photo.startsWith("data:image")) n++;
    else if (photoIsLocal(x.photo) && !PHOTO_CACHE[photoLocalId(x.photo)] && x.photoCloudUrl) n++;

}

    for (const k of PHOTO_KEYS) {
      const list = DB[k] || [];
      for (const x of list) {
        if (!x || typeof x.photo !== "string") continue;
        const p = x.photo;
        let ref = null, cloudUrl = x.photoCloudUrl || null;
        if (p.startsWith("data:image")) {
          ref = photoPut(p);
        } else if (p.startsWith("http")) {
          const id = photoIdFromUrl(p);
          PHOTO_URL_FALLBACK[id] = p;
          if (PHOTO_CACHE[id]) ref = "local:" + id;
          else { const d = await photoDownload(p); if (d) ref = photoPut(d, id); }
          cloudUrl = p;
        } else if (photoIsLocal(p) && x.photoCloudUrl) {
          const id = photoLocalId(p);
          PHOTO_URL_FALLBACK[id] = x.photoCloudUrl;
          if (!PHOTO_CACHE[id]) { const d = await photoDownload(x.photoCloudUrl); if (d) { photoPut(d, id); moved++; } else failed++; }
          continue;
        } else continue;
        if (!ref) { failed++; continue; }
        const idx = (DB[k] || []).findIndex((y) => y.id === x.id && y.photo === p);
        if (idx === -1) continue;
        DB[k][idx] = { ...DB[k][idx], photo: ref, ...(cloudUrl ? { photoCloudUrl: cloudUrl } : {}) };
        moved++;
      }
      if (moved) persist(k);
    }

  } catch (e) { console.error("photo migration failed", e); }

function render() {

  // otherwise typing in any input loses focus (and closes the keyboard on mobile) every keystroke.
  const active = document.activeElement;
  const activeId = active && active.id;
  let selStart = null, selEnd = null;
  try {
    selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  } catch (e) { /* type="text" inputmode="decimal" inputs throw when reading selection — ignore, just skip cursor restore */ }
  const scrollY = window.scrollY;
  // النوافذ (زي فاتورة البيع) عندها تمرير داخلي خاص بيها، منفصل عن تمرير الصفحة —
  // لازم نحفظه ونرجّعه برضه، وإلا كل حرف بتكتبه بيرجّع النافذة لأولها من غير قصد
  const modalBoxBefore = document.querySelector(".modal-box");

  } else {
    app.innerHTML = renderHeader() + `<main class="app-main">${renderScreen()}</main>` + renderFloatingBar() + renderModal();
  }
  afterRenderHooks();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT")) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
  window.scrollTo(0, scrollY);
  if (modalScrollTop !== null) {
    const modalBoxAfter = document.querySelector(".modal-box");
    if (modalBoxAfter) modalBoxAfter.scrollTop = modalScrollTop;
  }
}

function repHandoverModalHtml() {
  const rep = currentRep();

  const cashVouchersToday = myVouchers.filter((v) => v.method !== "check" && new Date(v.ts).toDateString() === todayStr0).reduce((a, v) => a + (v.cashAmount ?? v.amount), 0);
  const myHandoversToday = (loadKey("cashHandovers", []) || []).filter((h) => h.repId === rep.id && new Date(h.ts).toDateString() === todayStr0 && h.status !== "rejected");
  const handedOverToday = myHandoversToday.reduce((a, h) => a + h.amount, 0);
  const cashToday = Math.max(0, cashSalesToday + cashVouchersToday - handedOverToday);

function repSubmitHandover(amount) {
  const rep = currentRep();
  if (!rep || amount <= 0) { flash("مفيش كاش تسلمه دلوقتي"); return; }
  const handovers = loadKey("cashHandovers", []) || [];
  handovers.push({ id: uid(), repId: rep.id, repName: rep.name, amount, ts: new Date().toISOString(), status: "pending" });
  saveKey("cashHandovers", handovers);
  flash("تم إرسال طلب التسليم — في انتظار تأكيد الحساب الرئيسي");
  closeModal();
}
function confirmHandover(handoverId) {
  const handovers = loadKey("cashHandovers", []) || [];
  const h = handovers.find((x) => x.id === handoverId);
  if (!h || h.status !== "pending") return;
  h.status = "confirmed"; h.confirmedAt = new Date().toISOString();
  saveKey("cashHandovers", handovers);
  addScoped("manualCash", { id: uid(), ts: new Date().toISOString(), type: "in", amount: h.amount, desc: `تسليم كاش من المندوب: ${h.repName}`, handoverId: h.id });
  flash(`تم تأكيد استلام ${fmt(h.amount)} من ${h.repName}`);
  render();
  scheduleRepPublish(500);
}
function rejectHandover(handoverId) {
  const handovers = loadKey("cashHandovers", []) || [];
  const h = handovers.find((x) => x.id === handoverId);
  if (!h) return;
  h.status = "rejected";
  saveKey("cashHandovers", handovers);
  flash("تم رفض الطلب");
  render();
  scheduleRepPublish(500);
}

function applyPriceCalc(cartType, productId) {

function playAddSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!window._daftarAudioCtx) window._daftarAudioCtx = new AudioCtx();
    const ctx = window._daftarAudioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const notes = [[880, now, 0.09], [1318.5, now + 0.07, 0.13]]; // "تيك" قصيرة بنغمتين زي صوت كاشير خفيف
    notes.forEach(([freq, start, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    });
  } catch (e) { /* لو المتصفح رفض الصوت لأي سبب، تجاهله بهدوء من غير ما يكسر الإضافة */ }
}

// متوسط تكلفة مرجّح: بيدمج الكمية والسعر القديم مع الجديد بشكل عادل، عشان كشف المخزون يعكس التكلفة الحقيقية مش آخر سعر بس
function weightedAvgCost(oldStock, oldCost, newQty, newCost) {
  const os = oldStock || 0;
  const oc = oldCost || 0;
  const nq = newQty || 0;
  const nc = newCost || 0;
  if (os <= 0) return nc || oc; // مفيش رصيد قديم فعلي (صفر أو سالب) -> اعتمد على السعر الجديد
  const totalQty = os + nq;
  if (totalQty <= 0) return nc || oc;
  return (os * oc + nq * nc) / totalQty;
}
function addToPCart(productId) {
  const p = scoped("products").find((x) => x.id === productId);
  if (!p) return;
  const ex = state.pcart.find((c) => c.productId === productId);
  if (ex) ex.qty++;
  else state.pcart.push({ productId: p.id, name: p.name, cost: p.cost || 0, qty: 1 });
  playAddSound();
  render();
}
function removePCartItem(productId) { state.pcart = state.pcart.filter((c) => c.productId !== productId); render(); }
function changePCartQty(productId, d) { const it = state.pcart.find((c) => c.productId === productId); if (it) it.qty = Math.max(0.01, it.qty + d); render(); }
function setPCartQty(productId, val) { const it = state.pcart.find((c) => c.productId === productId); if (it) it.qty = Math.max(0.01, parseFloat(val) || 1); render(); }
function changePCartCost(productId, val) { const it = state.pcart.find((c) => c.productId === productId); if (it) it.cost = parseFloat(val) || 0; render(); }
function setPurchasePayType(t) {
  state.purchaseForm.payType = t;
  const total = state.purchaseForm.quickMode ? (parseFloat(state.purchaseForm.quickTotal) || 0) : state.pcart.reduce((a, c) => a + c.cost * c.qty, 0);
  state.purchaseForm.paidNow = t === "cash" ? String(total || "") : "";
  render();
}
function resetPurchaseForm() {
  state.pcart = []; state.purchaseForm = { supplierId: "", payType: "cash", paidNow: "", quickMode: false, invoiceNo: "", quickTotal: "", photo: null }; state.editingPurchaseId = null;

function completePurchase() {
  if (state.purchaseForm.quickMode) return completeQuickPurchase();
  syncPartyField("purchase-supplier");
  const total = state.pcart.reduce((a, c) => a + c.cost * c.qty, 0);
  const payType = state.purchaseForm.payType;
  if (payType === "cash" && String(state.purchaseForm.paidNow || "").trim() === "") state.purchaseForm.paidNow = String(Math.round(total * 1000) / 1000);
  const paidNum = parseFloat(state.purchaseForm.paidNow) || 0;
  let supplierId = state.purchaseForm.supplierId || null;
  if (!state.pcart.length) { flash("⚠️ أضف صنف واحد على الأقل"); return; }
  if (payType === "cash" && paidNum < total - 0.0001) { flash("⚠️ المبلغ المدفوع أقل من الإجمالي — إذا الباقي دين اختار «آجل»"); render(); return; }
  if (payType !== "cash" && !supplierId) { flash("⚠️ اكتب اسم المورد (الفاتورة آجل)"); render(); return; }

  // if a customer name was picked instead of an existing supplier, auto-create a linked supplier record
  if (supplierId && supplierId.startsWith("custlink:")) {
    const customerId = supplierId.slice("custlink:".length);
    const customer = scoped("customers").find((c) => c.id === customerId);
    const newSupplier = { id: uid(), name: customer ? customer.name : "عميل", phone: customer ? customer.phone : "", opening: 0, notes: "تم إنشاؤه تلقائيًا من حساب عميل بنفس الاسم" };
    addScoped("suppliers", newSupplier);
    supplierId = newSupplier.id;
    flash(`تم إنشاء حساب مورد جديد باسم ${newSupplier.name} تلقائيًا`);
  }

  const products = scoped("products");
  const destWarehouseId = state.editingPurchaseId ? null : (state.purchaseForm.destWarehouseId || null);
  if (state.editingPurchaseId) {
    const oldP = scoped("purchases").find((p) => p.id === state.editingPurchaseId);
    if (!oldP.destWarehouseId) {
      const delta = {};
      oldP.items.forEach((it) => { delta[it.productId] = (delta[it.productId] || 0) - it.qty; });
      state.pcart.forEach((c) => { delta[c.productId] = (delta[c.productId] || 0) + c.qty; });
      persistScoped("products", products.map((p) => (delta[p.id] ? { ...p, stock: p.stock + delta[p.id] } : p)));
    }
    const updated = { ...oldP, supplierId, items: state.pcart.map((c) => ({ productId: c.productId, name: c.name, cost: c.cost, qty: c.qty })), total, paidNow: paidNum, payType };
    persistScoped("purchases", scoped("purchases").map((p) => (p.id === state.editingPurchaseId ? updated : p)));
    flash("تم تحديث فاتورة الشراء");
  } else {
    if (destWarehouseId) {
      state.pcart.forEach((c) => {
        addScoped("warehouseEntries", { id: uid(), warehouseId: destWarehouseId, ts: new Date().toISOString(), type: "in", productName: c.name, qty: c.qty, unit: "", party: "", note: "شراء فاتورة" });
      });
    } else {
      persistScoped("products", products.map((p) => { const it = state.pcart.find((c) => c.productId === p.id); return it ? { ...p, stock: p.stock + it.qty, cost: weightedAvgCost(p.stock, p.cost, it.qty, it.cost) } : p; }));
    }
    const purchase = { id: uid(), ts: new Date().toISOString(), supplierId, items: state.pcart.map((c) => ({ productId: c.productId, name: c.name, cost: c.cost, qty: c.qty })), total, paidNow: paidNum, payType, destWarehouseId: destWarehouseId || undefined, repId: state._activeRepId || undefined };
    addScoped("purchases", purchase);
    flash("تم تسجيل فاتورة الشراء");
  }
  resetPurchaseForm();
}

function deletePurchase(id) {

let scannerStream = null;

function openScanModal(context) {

function scanIntoBarcodeField() {

  };

}
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function fillCheckAmount(selectEl) {
  const opt = selectEl.options[selectEl.selectedIndex];
  const amt = opt ? opt.getAttribute("data-amount") : "";
  const input = document.getElementById("v-amount");
  if (input && amt) input.value = amt;
}
function handleScanResult(context, code) {
  stopScanner();
  if (context === "field" && pendingCapture) {
    const cap = pendingCapture; pendingCapture = null;
    if (cap.kind === "product") {
      const existing = scoped("products").find((p) => p.barcode && p.barcode === code && p.id !== cap.vals.id);
      if (existing) {
        flash(`⚠️ الباركود ده مسجّل أصلاً على صنف اسمه "${existing.name}" — هفتحلك بياناته بدل ما تعمل صنف مكرر`);
        state.modal = { type: "product", product: existing };
        render();
        return;
      }
      state.modal = { type: "product", product: {
        id: cap.vals.id, name: cap.vals.name, sku: cap.vals.sku, barcode: code, category: cap.vals.category,
        price: cap.vals.price, cost: cap.vals.cost, stock: cap.vals.stock, minStock: cap.vals.minStock,
      } };
    } else {
      const existing = scoped("products").find((p) => p.barcode && barcodeMatches(p.barcode, code));
      if (existing) {
        flash(`⚠️ الباركود ده مسجّل أصلاً على صنف اسمه "${existing.name}"`);
        state.modal = { type: "product", product: existing };
        render();
        return;
      }
      state.modal = { type: "newItem", name: cap.vals.name, barcode: code };
    }
    render();

}
// مطابقة الباركود مع تسامح بسيط (EAN-13 مقابل UPC-A، ورقم التحقق الأخير)
function barcodeMatches(saved, code) {
  saved = String(saved || "").trim(); code = String(code || "").trim();
  if (!saved || !code) return false;
  if (saved === code) return true;
  if (/^\d+$/.test(saved) && /^\d+$/.test(code)) {
    if (code.length === 13 && code[0] === "0" && code.slice(1) === saved) return true;
    if (saved.length === 13 && saved[0] === "0" && saved.slice(1) === code) return true;
    if (code.length === 13 && saved.length === 12 && code.slice(0, 12) === saved) return true;
  }
  return false;
}
// بنقبل القراءة بس لما تتأكد: إذا طابقت صنف موجود فوراً، وإلا لازم نفس الرقم ينقرا 3 مرات ورا بعض
function makeScanAcceptor(onDetect) {
  const known = scoped("products").map((p) => String(p.barcode || "").trim()).filter(Boolean);
  let last = "", count = 0, done = false;
  return (raw) => {
    if (done) return true;
    const v = String(raw || "").trim();
    if (!v) return false;
    const hit = known.find((k) => barcodeMatches(k, v));
    if (hit) { done = true; onDetect(hit); return true; }
    if (v === last) count++; else { last = v; count = 1; }
    if (count >= 3) { done = true; onDetect(v); return true; }
    return false;
  };
}
async function startScanner(onDetectRaw) {
  const onDetect = makeScanAcceptor(onDetectRaw);
  const video = document.getElementById("scanner-video");
  const errBox = document.getElementById("scanner-error");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    scannerStream = stream;
    if (!video) return;
    video.srcObject = stream;
    await video.play();
    if (!("BarcodeDetector" in window)) {
      // بعض الأجهزة (خصوصًا داخل التطبيق) ما فيها قارئ باركود جاهز، فبنحمّل مكتبة بديلة
      try {
        await loadZxing();
        let hints;
        try {
          const Z = window.ZXing; hints = new Map();
          hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
        } catch (e) { hints = undefined; }
        zxingReader = new window.ZXing.BrowserMultiFormatReader(hints);
        zxingReader.decodeFromVideoElementContinuously(video, (result) => {
          if (result && state.modal && state.modal.type === "scan") {
            const t = result.getText();
            if (onDetect(t)) stopZxing();
          }
        });
      } catch (e2) {
        console.error("zxing failed", e2);
        if (errBox) errBox.textContent = "ما قدرنا نشغّل قارئ الباركود على هالجهاز. اكتب الرمز يدويًا بالأسفل.";
      }
      return;
    }
    let fmts = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"];
    try { const sup = await window.BarcodeDetector.getSupportedFormats(); fmts = fmts.filter((f) => sup.includes(f)); } catch (e) {}
    const detector = new window.BarcodeDetector({ formats: fmts });
    const tick = async () => {
      if (!state.modal || state.modal.type !== "scan") return;
      try {
        const codes = await detector.detect(video);
        for (const c of codes || []) { if (onDetect(c.rawValue)) return; }
      } catch (e) {}
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } catch (e) {
    console.error("camera failed", e);
    if (errBox) errBox.textContent = "تعذّر الوصول إلى الكاميرا. تأكد إنك سمحت للتطبيق يستخدم الكاميرا (من إعدادات الجوال ← التطبيقات ← دفتر ← الأذونات)، أو اكتب رمز الباركود يدويًا بالأسفل.";
  }
}
let zxingReader = null;
function loadZxing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    sc.onload = () => (window.ZXing ? resolve() : reject(new Error("zxing missing")));
    sc.onerror = () => reject(new Error("zxing load failed"));
    document.head.appendChild(sc);
  });
}
function stopZxing() { try { if (zxingReader) zxingReader.reset(); } catch (e) {} zxingReader = null; }
function stopScanner() { stopZxing(); if (scannerStream) { scannerStream.getTracks().forEach((t) => t.stop()); scannerStream = null; } }
function submitManualBarcode() {

function addVoucher(kind, partyId) {
  const desc = (document.getElementById("v-desc") || {}).value?.trim() || "";
  const list = kind === "customer" ? scoped("customers") : scoped("suppliers");
  const party = list.find((p) => p.id === partyId);

  if (kind === "customer") {
    // customer receipt: cash portion + zero or more checks, combined in one voucher
    const cashAmount = parseFloat((document.getElementById("v-cash") || {}).value) || 0;
    const rows = state._showChecksInVoucher ? (state._checkRows || []).filter((r) => (parseFloat(r.amount) || 0) > 0) : [];
    const checksTotal = rows.reduce((a, r) => a + (parseFloat(r.amount) || 0), 0);
    const amount = cashAmount + checksTotal;
    if (amount <= 0) { flash("أدخل مبلغ نقدي أو شيك واحد على الأقل"); return; }
    const method = rows.length > 0 && cashAmount > 0 ? "mixed" : rows.length > 0 ? "check" : "cash";
    const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc, method, cashAmount, checksCount: rows.length };
    rows.forEach((r) => {
      addScoped("checks", {
        id: uid(), ts: new Date().toISOString(), dueDate: r.dueDate || "", amount: parseFloat(r.amount) || 0,
        checkNo: r.checkNo || "", bank: r.bank || "", photo: r.photo || null,
        desc: `شيك من: ${party ? party.name : ""}${r.checkNo ? " — رقم " + r.checkNo : ""}${r.bank ? " — " + r.bank : ""}`,
        status: "pending", voucherId: v.id,
      });
    });
    addScoped("vouchers", v);
    flash(method === "mixed" ? "تم تسجيل السند (نقدي + شيك)" : rows.length > 0 ? `تم تسجيل ${rows.length} شيك وربطهم بذمة العميل` : "تم تسجيل تحصيل الدفعة");
    state._voucherCash = ""; state._showChecksInVoucher = false; state._checkRows = [];
    render();
    printVoucher(kind, v);
    return;
  }

  const isCheck = state._voucherMethod === "check";
  if (isCheck && kind === "supplier") {
    // endorsing one or more EXISTING checks to pay a supplier → deduct from checks pool, not cash
    const ids = state._selectedEndorseChecks || [];
    if (ids.length === 0) { flash("اختر شيك واحد على الأقل للتجيير"); return; }
    const label = `مجيّر لـ: ${party ? party.name : ""}${desc ? " — " + desc : ""}`;
    let total = 0;
    persistScoped("checks", scoped("checks").map((c) => {
      if (!ids.includes(c.id)) return c;
      total += c.amount;
      return { ...c, status: "endorsed", desc: label + (c.desc ? " (من: " + c.desc + ")" : "") };
    }));
    const amount = total;
    const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc, method: "check", checksCount: ids.length };
    addScoped("vouchers", v);
    flash(`تم تجيير ${ids.length} شيك للمورد`);
    state._voucherMethod = "cash"; state._selectedEndorseChecks = [];
    render();
    printVoucher(kind, v);
    return;
  }

  if (kind === "supplier" && state._voucherMethod === "own") {
    const amount = parseFloat((document.getElementById("v-amount") || {}).value) || 0;
    const checkNo = ((document.getElementById("v-chkno") || {}).value || "").trim();
    const bank = ((document.getElementById("v-bank") || {}).value || "").trim();
    const dueDate = (document.getElementById("v-due") || {}).value || "";
    if (amount <= 0) { flash("اكتب مبلغ الشيك"); return; }
    if (!dueDate) { flash("اختار تاريخ استحقاق الشيك"); return; }
    const label = `شيك صادر${checkNo ? " رقم " + checkNo : ""}${bank ? " — " + bank : ""} — استحقاق ${dueDate}${desc ? " — " + desc : ""}`;
    const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc: label, method: "owncheck", cashAmount: 0, checkNo, bank, dueDate };
    addScoped("vouchers", v);
    addScoped("issuedChecks", { id: uid(), ts: v.ts, voucherId: v.id, partyId, partyName: v.partyName, amount, checkNo, bank, dueDate, status: "pending", note: desc });
    flash("✅ تم تسجيل الشيك الصادر ونزلت ذمة المورد");
    state._voucherMethod = "cash";
    render();
    printVoucher(kind, v);
    return;
  }

  // plain cash voucher (supplier payment)
  const amount = parseFloat((document.getElementById("v-amount") || {}).value) || 0;
  if (amount <= 0) return;
  const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc, method: "cash" };
  addScoped("vouchers", v);
  flash(kind === "customer" ? "تم تسجيل تحصيل الدفعة" : "تم تسجيل الدفعة للمورد");
  render();
  printVoucher(kind, v);
}

function addCheckRow() { state._checkRows = state._checkRows || []; state._checkRows.push({ amount: "", checkNo: "", bank: "", dueDate: "", photo: null }); render(); }

function readAndCompressImage(file, callback, maxW, quality) {
  maxW = maxW || 900;
  quality = quality || 0.6;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL("image/jpeg", quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function replacePhotoInRecord(key, oldDataUrl, newUrl) {
  const idx = (DB[key] || []).findIndex((x) => x.photo === oldDataUrl);
  if (idx === -1) return;
  DB[key][idx] = { ...DB[key][idx], photo: newUrl };
  const ok = persist(key);
  if (ok) protectRecentlyAdded(key, DB[key][idx]);
  render();
}

function openCollectModal(id) { state.modal = { type: "collectCheck", id }; render(); }
function submitCollect(id) {
  const c = scoped("checks").find((x) => x.id === id);
  if (!c) return;
  const amount = parseFloat(document.getElementById("collect-amount").value) || 0;
  if (amount <= 0) return;
  const capped = Math.min(amount, c.amount);
  addScoped("manualCash", { id: uid(), ts: new Date().toISOString(), type: "in", amount: capped, desc: `تحصيل ${capped < c.amount ? "جزئي " : ""}شيك: ${c.desc || "بدون بيان"}` });
  const remaining = c.amount - capped;
  if (remaining <= 0.001) {
    persistScoped("checks", scoped("checks").map((x) => (x.id === id ? { ...x, status: "collected", amount: 0 } : x)));
    flash("تم تحصيل الشيك بالكامل وإضافته للنقدية");
  } else {
    persistScoped("checks", scoped("checks").map((x) => (x.id === id ? { ...x, amount: remaining } : x)));
    flash(`تم تحصيل ${fmt(capped)} — الباقي ${fmt(remaining)} لسه قيد التحصيل`);

function deleteManualCash(rawId) { if (!confirm("متأكد إنك بدك تمسح الحركة هاي؟ ما في رجعة بعد الحذف.")) return;
  const m0 = scoped("manualCash").find((m) => m.id === rawId);
  if (m0 && String(m0.desc || "").startsWith("تسليم كاش من المندوب")) {
    // نلغي التسليم كمان عشان "كاش اليوم" عند المندوب يرجع صح
    const hs = loadKey("cashHandovers", []) || [];
    const h = m0.handoverId ? hs.find((x) => x.id === m0.handoverId) : hs.find((x) => x.status === "confirmed" && Math.abs(x.amount - m0.amount) < 1e-9 && m0.desc.endsWith(x.repName || "\u0000"));
    if (h) { h.status = "rejected"; saveKey("cashHandovers", hs); scheduleRepPublish(500); }
  }
  persistScoped("manualCash", scoped("manualCash").filter((m) => m.id !== rawId)); flash("تم حذف الحركة"); render(); }

// بنخلّي الباركود يتصغّر جوّا الملصق بدل ما يطلع برّاه
function barcodeFormatFor(code) {
  const c = String(code || "");
  if (/^\d{13}$/.test(c)) { let sum = 0; for (let i = 0; i < 12; i++) sum += Number(c[i]) * (i % 2 ? 3 : 1); if ((10 - (sum % 10)) % 10 === Number(c[12])) return "EAN13"; }
  return "CODE128";
}
function fitBarcodeSvg(el) {
  try {
    const w = parseFloat(el.getAttribute("width")), h = parseFloat(el.getAttribute("height"));
    if (w && h) { el.setAttribute("viewBox", `0 0 ${w} ${h}`); el.setAttribute("width", "100%"); el.setAttribute("height", "46"); el.setAttribute("preserveAspectRatio", "none"); }
  } catch (e) {}
}
function getOrCreateBarcode(product) {
  if (product.barcode && product.barcode.trim()) return product.barcode.trim();
  let code = "";
  const ean13 = (d12) => { let sum = 0; for (let i = 0; i < 12; i++) sum += Number(d12[i]) * (i % 2 ? 3 : 1); return d12 + ((10 - (sum % 10)) % 10); };
  do { code = ean13("2" + String(Math.floor(Math.random() * 100000000000)).padStart(11, "0")); }
  while (scoped("products").some((p) => p.barcode === code));
  persistScoped("products", scoped("products").map((p) => (p.id === product.id ? { ...p, barcode: code } : p)));
  return code;
}
function printBarcodeLabelsBulk() {
  const settings = currentSettings();
  const products = scoped("products");
  const items = [];
  Object.entries(state._barcodeQty || {}).forEach(([pid, qtyStr]) => {
    const qty = parseInt(qtyStr) || 0;
    const product = products.find((p) => p.id === pid);
    if (product && qty > 0) {
      const code = getOrCreateBarcode(product);
      for (let i = 0; i < qty; i++) items.push({ name: product.name, price: product.price, code });
    }
  });
  if (items.length === 0) { flash("حط كمية للأصناف اللي عايز تطبعها"); return; }
  const labelsHtml = items.map((it, i) => `
    <div style="width:31%;display:inline-block;border:1px dashed #999;border-radius:6px;padding:8px 4px;margin:4px 1%;text-align:center;page-break-inside:avoid;break-inside:avoid;vertical-align:top;">
      <svg class="barcode-svg" data-value="${esc(it.code)}" style="width:100%;height:46px;"></svg>
    </div>`).join("");
  const html = `<div>${labelsHtml}</div>`;
  showPrint(html);
  setTimeout(() => {
    document.querySelectorAll(".barcode-svg").forEach((el) => {
      try { window.JsBarcode(el, el.dataset.value, { format: barcodeFormatFor(el.dataset.value), displayValue: false, height: 44, margin: 4 }); fitBarcodeSvg(el); } catch (e) { console.error("barcode render failed", e); }
    });
  }, 30);
  closeModal();
}

function saveProductFromForm() {
  const id = state.modal.product ? state.modal.product.id : null;
  const existingPhoto = state.modal.product ? state.modal.product.photo || "" : "";
  const photo = state._prPhotoRemoved ? "" : (state._prPhoto || existingPhoto);
  const form = {
    id: id || uid(),
    name: document.getElementById("pr-name").value.trim(),
    sku: document.getElementById("pr-sku").value.trim(),
    barcode: document.getElementById("pr-barcode").value.trim(),
    category: document.getElementById("pr-category").value.trim(),

    cost: parseFloat(document.getElementById("pr-cost").value) || 0,
    stock: parseInt(document.getElementById("pr-stock").value) || 0,
    minStock: parseInt(document.getElementById("pr-minstock").value) || 5,
    photo: (photo && photo.startsWith("data:")) ? photoPut(photo) : (photo || null),
  };
  if (!form.name) return;
  const list = scoped("products");

  if (form.barcode) {
    const dupBarcode = list.find((p) => p.barcode && p.barcode === form.barcode && p.id !== form.id);
    if (dupBarcode) { flash(`⚠️ الباركود ده مسجّل أصلاً على صنف اسمه "${dupBarcode.name}" — كل باركود لازم يكون لصنف واحد بس`); return; }
  }

  if (!id) {
    const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");
    const newNorm = norm(form.name);
    const exact = list.find((p) => norm(p.name) === newNorm);
    if (exact) { flash(`⚠️ في صنف بنفس الاسم بالظبط ("${exact.name}") — عدّله بدل ما تضيفه تاني`); return; }

    if (!state._confirmDuplicateProduct) {
      const similar = list.find((p) => { const pn = norm(p.name); return pn !== newNorm && (pn.includes(newNorm) || newNorm.includes(pn)); });
      if (similar) {
        state._confirmDuplicateProduct = true;
        flash(`⚠️ في صنف قريب بالاسم ("${similar.name}") — لو متأكد إنه مختلف فعلاً، دوس "حفظ" تاني للتأكيد`);
        return;
      }
    }
  }
  state._confirmDuplicateProduct = false;

  if (id) persistScoped("products", list.map((p) => (p.id === id ? form : p)));
  else persistScoped("products", [...list, form]);
  closeModal();
}

function renderReports() {
  const settings = currentSettings();
  const products = scoped("products"), suppliers = scoped("suppliers"), customers = scoped("customers");
  const allSales = scoped("sales"), allPurchases = scoped("purchases"), allExpenses = scoped("expenses");
  const range = state.reportRange;
  const inRange = (ts) => {
    const d = new Date(ts), now = new Date();
    if (range === "today") return todayStr(ts) === todayStr(now);
    if (range === "7d") return now - d <= 7 * 86400000;
    if (range === "30d") return now - d <= 30 * 86400000;
    return true;
  };
  const fSales = allSales.filter((s) => inRange(s.ts));
  const fPurchases = allPurchases.filter((p) => inRange(p.ts));
  const fExpenses = allExpenses.filter((e) => inRange(e.ts));
  const revenue = fSales.reduce((a, s) => a + s.total, 0);
  const collected = fSales.reduce((a, s) => a + s.paidNow, 0);
  const purchaseTotal = fPurchases.reduce((a, p) => a + p.total, 0);
  const expenseTotal = fExpenses.reduce((a, e) => a + e.amount, 0);
  const costMap = Object.fromEntries(products.map((p) => [p.id, p.cost || 0]));
  const grossProfit = fSales.reduce((a, s) => a + s.items.reduce((b, it) => b + (it.price - (costMap[it.productId] || 0)) * it.qty, 0), 0);
  const topMap = {};
  fSales.forEach((s) => s.items.forEach((it) => { if (!topMap[it.name]) topMap[it.name] = { name: it.name, qty: 0, revenue: 0 }; topMap[it.name].qty += it.qty; topMap[it.name].revenue += it.price * it.qty; }));
  const topProducts = Object.values(topMap).sort((a, b) => b.qty - a.qty).slice(0, 5);
  const lowStock = products.filter((p) => p.stock <= (p.minStock ?? 5));
  const owedByCustomers = customers.map((c) => ({ ...c, bal: customerBalance(c) })).filter((c) => c.bal > 0);
  const owedToSuppliers = suppliers.map((s) => ({ ...s, bal: supplierBalance(s) })).filter((s) => s.bal > 0);

  const ranges = [["today", "اليوم"], ["7d", "٧ أيام"], ["30d", "٣٠ يوم"], ["all", "الكل"]];
  let html = `<div class="row-flex" style="justify-content:space-between;">

  html += `<div class="card" style="padding:12px;margin-top:12px;margin-bottom:14px;">

      <label class="field" style="margin-bottom:0;"><span class="lbl">إلى تاريخ</span><input id="report-range-to" type="date" class="mono" value="${state._reportRangeTo || todayStr(Date.now())}" oninput="state._reportRangeTo=this.value;" /></label>

    <button class="btn btn-ghost btn-block" style="background:var(--greenLight);color:var(--green);margin-bottom:8px;" onclick="setLastMonthRange()">⏪ آخر شهر بضغطة واحدة</button>
    <button class="btn btn-green btn-block" onclick="printRangeReport(document.getElementById('report-range-from').value, document.getElementById('report-range-to').value)">🖨 اطبع كشف الفترة</button>
  </div>`;

  html += `<div class="section-title">المبيعات</div><div class="stat-row">
    <div class="stat-card"><div class="stat-label"><span>الإيرادات</span></div><div class="stat-value">${fmt(revenue)} ${esc(settings.currency)}</div></div>
    <div class="stat-card"><div class="stat-label"><span>المحصّل نقدًا</span></div><div class="stat-value">${fmt(collected)} ${esc(settings.currency)}</div></div>
    <div class="stat-card"><div class="stat-label"><span>عدد الفواتير</span></div><div class="stat-value">${fSales.length}</div></div>
  </div>
  <div class="stat-row" style="grid-template-columns:1fr;"><div class="stat-card"><div class="stat-label"><span>الربح التقديري</span></div><div class="stat-value">${fmt(grossProfit)} ${esc(settings.currency)}</div></div></div>`;

  html += `<div class="section-title">المشتريات والمصروفات</div><div class="stat-row" style="grid-template-columns:1fr 1fr;">
    <div class="stat-card"><div class="stat-label"><span>إجمالي المشتريات</span></div><div class="stat-value">${fmt(purchaseTotal)} ${esc(settings.currency)}</div></div>
    <div class="stat-card"><div class="stat-label"><span>إجمالي المصروفات</span></div><div class="stat-value">${fmt(expenseTotal)} ${esc(settings.currency)}</div></div>

  if (owedByCustomers.length || owedToSuppliers.length) {
    html += `<div class="flex-between" style="margin-top:8px;"><div class="section-title" style="margin:0;">الذمم</div>
      <button class="btn btn-ghost" style="background:var(--greenLight);color:var(--green);font-size:11px;padding:5px 10px;" onclick="printDebtsStatement()">🖨 كشف الذمم بالأسماء</button>

      <div class="stat-card"><div class="stat-label"><span>مستحق لنا (عملاء)</span></div><div class="stat-value">${fmt(owedByCustomers.reduce((a, c) => a + c.bal, 0))} ${esc(settings.currency)}</div></div>

      <span class="mono" style="font-weight:600;">${fmt(t.revenue)} ${esc(settings.currency)}</span></div>`).join("") + `</div>`;
  }
  return html;
}

function confirmTransfer(warehouseId) {
  const mode = state._whEntryType;
  const isIn = mode === "transfer_in";
  const cart = state._transferCart && state._transferCart.length > 0 ? state._transferCart : (() => {
    const productId = state._transferScannedProductId || "";

  if (cart.length === 0) { flash("أضف صنف واحد على الأقل"); return; }

  if (isIn) {
    for (const item of cart) {
      const product = scoped("products").find((p) => p.id === item.productId);
      if (!product || item.qty > product.stock) { flash(`ما ينفعش — المتوفر بالمحل بس ${product ? fmt(product.stock) : 0} من "${item.name}"`); return; }

      const available = existing.reduce((a, e) => a + (e.type === "in" ? e.qty : -e.qty), 0);

  cart.forEach((item) => {

      addScoped("warehouseEntries", { id: uid(), warehouseId, ts: batchTs, type: "in", productName: item.name, qty: item.qty, unit: "", party: "", note: "منقول من المحل", batch });
    } else {
      persistScoped("products", scoped("products").map((p) => (p.id === item.productId ? { ...p, stock: p.stock + item.qty } : p)));
      addScoped("warehouseEntries", { id: uid(), warehouseId, ts: batchTs, type: "out", productName: item.name, qty: item.qty, unit: "", party: "", note: "منقول للمحل", batch });

function currentMonthKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function monthKeyOf(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function monthLabel(key) {
  const [y, m] = key.split("-");
  const names = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  return `${names[parseInt(m, 10) - 1]} ${y}`;
}
// بيحسب "المتبقي له" لشهر معيّن آخذ بعين الاعتبار أي زيادة سحبها في الأشهر اللي قبله (بتتخصم من هالشهر تلقائي، مش بترجع تتصفّر)
function employeeRunningBalance(employeeId, monthlySalary, uptoMonthKey) {
  const allTx = scoped("employeeTx").filter((t) => t.employeeId === employeeId);
  const monthsWithTx = [...new Set(allTx.map((t) => monthKeyOf(t.ts)))];
  const months = [...new Set([...monthsWithTx, uptoMonthKey])].filter((m) => m <= uptoMonthKey).sort();
  let balance = 0;
  for (const m of months) {
    const withdrawnThisMonth = allTx.filter((t) => monthKeyOf(t.ts) === m).reduce((a, t) => a + t.amount, 0);
    balance += monthlySalary - withdrawnThisMonth;
  }
  return balance;
}

/* ===================== طباعة مباشرة عبر البلوتوث (Web Bluetooth + ESC/POS raster) ===================== */
const BT_PRINT_CANDIDATE_UUIDS = [
  "49535343-fe7d-4ae5-8fa9-9fafd205e455", // ISSC transparent UART (common on cheap BLE thermal printers)
  0xffe0, "0000ffe0-0000-1000-8000-00805f9b34fb",
  0xff00, "0000ff00-0000-1000-8000-00805f9b34fb",
  0x18f0, "000018f0-0000-1000-8000-00805f9b34fb",
  0xfff0, "0000fff0-0000-1000-8000-00805f9b34fb",
];
async function findWritableCharacteristic(server) {
  const services = await server.getPrimaryServices();
  for (const svc of services) {
    let chars = [];
    try { chars = await svc.getCharacteristics(); } catch (e) { continue; }
    for (const ch of chars) {
      if (ch.properties.write || ch.properties.writeWithoutResponse) return ch;
    }
  }
  return null;
}
function btPrintStatus(msg) {
  const el = document.getElementById("bt-print-status");
  if (el) el.textContent = msg;
}
async function writeInChunks(characteristic, bytes, chunkSize) {
  for (let i = 0; i < bytes.length; i += chunkSize) {
    const chunk = bytes.slice(i, i + chunkSize);
    if (characteristic.properties.writeWithoutResponse) {
      await characteristic.writeValueWithoutResponse(chunk);
    } else {
      await characteristic.writeValue(chunk);
    }
    await new Promise((r) => setTimeout(r, 20));
  }
}
/* ===================== طباعة عبر الجسر الأصلي (html2canvas + TSPL) ===================== */
// بيلتقط الفاتورة كصورة طبق الأصل زي ما بتظهر بالمعاينة، بعرض الطابعة
async function capturePrintRootCanvas() {
  const target = document.getElementById("print-capture") || document.getElementById("print-root");
  const PRINT_WIDTH = parseInt(localStorage.getItem("btPaperWidthPx")) || 576; // 80mm = 576 نقطة
  const rectWidth = target.offsetWidth || 360;
  const scale = PRINT_WIDTH / rectWidth;
  const canvas = await html2canvas(target, {
    backgroundColor: "#ffffff",
    scale: scale,
    useCORS: true,
    logging: false,
    windowWidth: rectWidth,
  });
  return canvas;
}
// بيحوّل صورة الفاتورة لأوامر TSPL (اللغة اللي طابعة XP-P322B بتفهمها)
function canvasToTsplBytes(canvas) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h).data;
  const bytesPerRow = Math.ceil(w / 8);
  const bitmap = new Uint8Array(bytesPerRow * h);
  for (let yy = 0; yy < h; yy++) {
    for (let bx = 0; bx < bytesPerRow; bx++) {
      let byte = 0;
      for (let bit = 0; bit < 8; bit++) {
        const xx = bx * 8 + bit;
        let black = false;
        if (xx < w) {
          const idx = (yy * w + xx) * 4;
          const a = img[idx + 3];
          const lum = img[idx] * 0.3 + img[idx + 1] * 0.59 + img[idx + 2] * 0.11;
          black = a > 128 && lum < 160;
        }
        if (!black) byte |= (0x80 >> bit); // TSPL: بِت 0 = أسود يُطبع، 1 = أبيض
      }
      bitmap[yy * bytesPerRow + bx] = byte;
    }
  }
  const mm = (px) => (px / 8).toFixed(1);
  const heightMm = Math.max(10, Math.ceil(h / 8) + 5);
  const header = `SIZE ${mm(w)} mm,${heightMm} mm\r\nGAP 0 mm,0 mm\r\nDIRECTION 0\r\nREFERENCE 0,0\r\nCLS\r\n`;
  const bitmapCmd = `BITMAP 0,0,${bytesPerRow},${h},0,`;
  const footer = `\r\nPRINT 1,1\r\n`;
  const enc = (s) => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xff; return a; };
  const hB = enc(header), cB = enc(bitmapCmd), fB = enc(footer);
  const total = new Uint8Array(hB.length + cB.length + bitmap.length + fB.length);
  let off = 0;
  total.set(hB, off); off += hB.length;
  total.set(cB, off); off += cB.length;
  total.set(bitmap, off); off += bitmap.length;
  total.set(fB, off);
  return total;
}
function bytesToBase64(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}
function getNativePairedPrinters() {

async function printViaNativeBridge(btn) {
  if (!isAndroidPrintBridge()) { btPrintStatus("❌ الطباعة المباشرة متاحة داخل التطبيق فقط."); return; }
  // صلاحية البلوتوث بنطلبها بس وقت الطباعة
  try {
    if (window.AndroidPrint.hasBluetoothPermission && !window.AndroidPrint.hasBluetoothPermission()) {
      window.AndroidPrint.requestBluetoothPermission();

    }
    btPrintStatus("جاري تجهيز الفاتورة…");
    const canvas = await capturePrintRootCanvas();
    const tsplBytes = canvasToTsplBytes(canvas);

    else btPrintStatus("❌ فشلت الطباعة: " + result + " — جرب 'تغيير الطابعة المحفوظة'.");
  } catch (e) {
    btPrintStatus("❌ خطأ: " + (e.message || e));
  } finally {
    if (btn) btn.disabled = false;
  }
}
function renderPrintRootToCanvas() {
  const root = document.getElementById("print-root");
  const clone = root.cloneNode(true);
  clone.querySelectorAll(".no-print").forEach((n) => n.remove());
  const WIDTH = 384; // 58mm @ ~203dpi thermal printers
  const lines = [];
  function walk(node) {
    if (node.nodeType === 3) {
      const t = node.textContent.replace(/\s+/g, " ").trim();
      if (t) lines[lines.length - 1].text += t;
      return;
    }
    if (node.nodeType !== 1) return;
    const disp = getComputedStyle ? null : null;
    const isBlock = ["DIV", "TR", "P", "TABLE"].includes(node.tagName);
    if (isBlock) lines.push({ text: "", bold: /700|bold/.test(node.style.fontWeight || ""), center: (node.style.textAlign === "center"), size: parseInt(node.style.fontSize) || 12 });
    if (lines.length === 0) lines.push({ text: "", bold: false, center: false, size: 12 });
    node.childNodes.forEach(walk);
    if (isBlock && node.tagName !== "TR") lines.push({ text: "", bold: false, center: false, size: 12 });
  }
  lines.push({ text: "", bold: false, center: false, size: 12 });
  walk(clone);
  const finalLines = lines.filter((l, i) => l.text.trim() !== "" || (i > 0 && lines[i - 1].text.trim() !== ""));
  const lineHeight = 30;
  const canvas = document.createElement("canvas");
  canvas.width = WIDTH;
  canvas.height = Math.max(60, finalLines.length * lineHeight + 20);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#000";
  ctx.direction = "rtl";
  let y = 20;
  for (const l of finalLines) {
    if (!l.text.trim()) { y += lineHeight * 0.5; continue; }
    ctx.font = `${l.bold ? "bold " : ""}${Math.min(l.size + 4, 22)}px 'Courier New', monospace`;
    ctx.textAlign = l.center ? "center" : "right";
    const x = l.center ? WIDTH / 2 : WIDTH - 8;
    ctx.fillText(l.text, x, y, WIDTH - 16);
    y += lineHeight;
  }
  return canvas;
}
function canvasToEscPosRaster(canvas) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const img = ctx.getImageData(0, 0, w, h).data;
  const bytesPerRow = Math.ceil(w / 8);
  const out = [];
  out.push(0x1d, 0x76, 0x30, 0x00);
  out.push(bytesPerRow & 0xff, (bytesPerRow >> 8) & 0xff);
  out.push(h & 0xff, (h >> 8) & 0xff);
  for (let yy = 0; yy < h; yy++) {
    for (let bx = 0; bx < bytesPerRow; bx++) {
      let byte = 0;
      for (let bit = 0; bit < 8; bit++) {
        const xx = bx * 8 + bit;
        if (xx >= w) continue;
        const idx = (yy * w + xx) * 4;
        const lum = img[idx] * 0.3 + img[idx + 1] * 0.59 + img[idx + 2] * 0.11;
        if (lum < 160) byte |= (0x80 >> bit);
      }
      out.push(byte);
    }
  }
  return new Uint8Array(out);
}
async function printViaBluetooth(btn) {
  if (!navigator.bluetooth) {
    alert("متصفحك ما بيدعم الطباعة المباشرة بالبلوتوث. جرب افتح الصفحة من متصفح Chrome.");
    return;
  }
  try {
    if (btn) btn.disabled = true;
    btPrintStatus("جاري البحث عن الطابعة… اختارها من القائمة");
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_PRINT_CANDIDATE_UUIDS });
    btPrintStatus("جاري الاتصال بـ " + (device.name || "الطابعة") + "…");
    const server = await device.gatt.connect();
    const characteristic = await findWritableCharacteristic(server);
    if (!characteristic) { btPrintStatus("ما لقيت قناة كتابة على هالجهاز — جرب طريقة الطباعة العادية."); return; }
    btPrintStatus("جاري تجهيز الفاتورة…");
    const canvas = renderPrintRootToCanvas();
    const imgBytes = canvasToEscPosRaster(canvas);
    const init = new Uint8Array([0x1b, 0x40]);
    const feedCut = new Uint8Array([0x1b, 0x64, 0x04, 0x1d, 0x56, 0x01]);
    btPrintStatus("جاري الطباعة…");
    await writeInChunks(characteristic, init, 20);
    await writeInChunks(characteristic, imgBytes, 20);
    await writeInChunks(characteristic, feedCut, 20);
    btPrintStatus("✅ تم إرسال الفاتورة للطابعة");
  } catch (e) {
    btPrintStatus("❌ فشلت الطباعة: " + (e.message || e));
  } finally {
    if (btn) btn.disabled = false;
  }
}

    return `<div class="floating-bar" onclick="openSaleCartSheet()">

function estimateStorageUsage() {
  let totalBytes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX)) totalBytes += (localStorage.getItem(k) || "").length;
    }
  } catch (e) {}
  return totalBytes;
}

function productHistory(productId) {
  const customers = scoped("customers"), suppliers = scoped("suppliers");
  const rows = [];
  scoped("sales").forEach((s) => {
    const it = s.items.find((x) => x.productId === productId);
    if (it) {
      const cust = s.customerId ? (customers.find((c) => c.id === s.customerId) || {}).name : "نقدي";
      rows.push({ ts: s.ts, type: "sale", qty: it.qty, price: it.price, party: cust });
    }
  });
  scoped("purchases").forEach((p) => {
    const it = p.items.find((x) => x.productId === productId);
    if (it) {
      const sup = (suppliers.find((s) => s.id === p.supplierId) || {}).name || "";
      rows.push({ ts: p.ts, type: "purchase", qty: it.qty, price: it.cost, party: sup });
    }
  });
  return rows.sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

/* ===================== المندوبين بحسابات حقيقية =====================
   صاحب الشركة بيضيف المندوب بإيميله وصلاحياته. تطبيق صاحب الشركة بيجهّز للمندوب "نسخة خاصة" (repViews)

const REP_TRACK_KEYS = ["sales", "vouchers", "checks", "purchases", "warehouseEntries", "customers", "cashHandovers", "products", "suppliers"];
const REP_DATA_KEYS = ["products", "customers", "suppliers", "sales", "vouchers", "checks", "purchases", "warehouses", "warehouseEntries"];

function repOutbox() { return loadKey("repOutbox", []) || []; }

function repSeriesMax() { return loadKey("repSeriesMax", {}) || {}; }
function repDefaultPerms() { return { sale: true, collect: true, purchase: false, changePrice: false, addCustomer: true, allCustomers: false }; }
function repCanEditPrice() { if (!REP_MODE) return true; const r = currentRep(); return !!(r && repPermissions(r).changePrice); }

/* ---------- جهاز المندوب: تسجيل كل حركة جديدة بصندوق الصادر ---------- */
function repRecordDiff(key, next) {
  if (!Array.isArray(next)) return;
  const prev = loadKey(key, []) || [];
  const prevMap = new Map(prev.filter((x) => x && x.id).map((x) => [x.id, x]));
  const ops = [];
  next.forEach((x) => {
    if (!x || !x.id) return;
    const p = prevMap.get(x.id);

  if (op.t !== "add" || !op.rec || !op.rec.id) return false;
  const allowed = {

    saveKey("cashHandovers", hs);
    return true;
  }
  DB[key] = DB[key] || [];
  if (DB[key].some((x) => x.id === op.rec.id)) return false;
  const rec = { ...op.rec, accountId: acc };
  if (key === "sales" || key === "purchases" || key === "vouchers") {
    rec.repId = rep.id;
    const series = docSeriesOf(key, rec);
    const used = DB[key].some((x) => x.accountId === acc && docSeriesOf(key, x) === series && x.no === rec.no);
    if (!rec.no || used) rec.no = docNextNo(key, series, acc);

}

  const myRepIds = new Set(reps.map((r) => r.id));
  const pendingHand = (loadKey("cashHandovers", []) || []).filter((h) => myRepIds.has(h.repId) && h.status === "pending");
  const whs = scoped("warehouses");
  let html = "";
  if (state.repRulesMissing) {
    html += `<div class="card" style="padding:14px;margin-bottom:14px;border:2px solid var(--stamp);background:var(--stampLight);">
      <div class="row-title" style="color:var(--stamp);margin-bottom:6px;">⚠️ لازم تحدّث قواعد الحماية بـ Firebase</div>
      <div class="row-sub">المندوبين ما رح يقدروا يشتغلوا قبل ما تلصق القواعد الجديدة (Firestore ← Rules).</div></div>`;
  }
  html += `<div class="card" style="padding:14px;margin-bottom:14px;">
    <div class="row-title" style="margin-bottom:4px;">👷 المندوبين</div>
    <div class="row-sub">كل مندوب بيسجّل دخول بإيميله على تطبيق دفتر، وبيشوف بس اللي بتسمحله فيه. حركاته (بيع، تحصيل...) بتوصلك لحالها لما تفتح التطبيق. ما بيشوف التكلفة ولا الأرباح ولا رأس المال.</div>
  </div>`;
  if (pendingHand.length) {
    html += `<div class="section-title">💵 تسليم كاش بانتظار تأكيدك</div><div class="card" style="margin-bottom:14px;">` + pendingHand.map((h) => `
      <div class="list-row"><div class="flex1"><div style="font-size:13px;font-weight:600;">${esc(h.repName || "")}</div><div class="mono row-sub">${fmtDateTime(h.ts)}</div></div>
        <span class="mono" style="font-weight:700;">${fmt(h.amount)}</span>
        <button class="btn btn-green" style="padding:6px 10px;font-size:12px;" onclick="confirmHandover('${h.id}')">استلمت ✓</button>
        <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px;" onclick="rejectHandover('${h.id}')">رفض</button></div>`).join("") + `</div>`;
  }
  html += reps.length === 0 ? emptyState("لا يوجد مندوبين بعد", true) : reps.map((r) => {
    const p = repPermissions(r);
    return `<div class="card" style="padding:12px;margin-bottom:12px;">
      <div class="flex-between" style="margin-bottom:6px;">
        <div><div class="row-title">${esc(r.name)}</div><div class="row-sub" dir="ltr" style="text-align:right;">${esc(r.email || "— بدون إيميل (نظام قديم)")}</div><div class="row-sub">${repPlaceLabel(r)}</div></div>
        <button class="icon-btn" style="color:var(--stamp);" onclick="deleteRepAccount('${r.id}')">🗑</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
        ${REP_PERM_LABELS.map(([k, lbl]) => `<button class="btn ${p[k] ? "btn-green" : "btn-ghost"}" style="padding:4px 10px;font-size:12px;min-height:0;" onclick="toggleRepPermission('${r.id}','${k}')">${p[k] ? "✓ " : ""}${lbl}</button>`).join("")}
      </div>
      <div class="row-flex" style="gap:6px;">
        ${p.allCustomers ? "" : `<button class="btn btn-ghost flex1" style="font-size:12px;" onclick="openRepCustomersModal('${r.id}')">👥 زباينه (${(r.customerIds || []).length})</button>`}
        <button class="btn btn-ghost flex1" style="font-size:12px;" onclick="openRepReportModal('${r.id}')">📊 تقرير</button>
      </div>
    </div>`;
  }).join("");
  html += state._showAddRep ? `<div class="card" style="padding:14px;margin-top:6px;">
      <div class="row-title" style="margin-bottom:10px;">➕ مندوب جديد</div>
      <label class="field"><span class="lbl">اسم المندوب</span><input id="nrep-name" /></label>
      <label class="field"><span class="lbl">إيميل المندوب (اللي رح يسجّل فيه)</span><input id="nrep-email" type="email" dir="ltr" autocomplete="off" /></label>
      <label class="field"><span class="lbl">بيبيع من</span><select id="nrep-place">
        <option value="__main__">🏪 المحل الرئيسي (مخزونك)</option>
        ${whs.map((w) => `<option value="${w.id}">🚚 ${esc(w.name)}</option>`).join("")}
      </select></label>
      <div class="row-sub" style="margin-bottom:10px;">لكل سيارة اعمل مستودع من «مستودعات خارجية» وحط فيه بضاعتها، واختاره هون.</div>
      <div class="row-flex" style="gap:8px;"><button class="btn btn-green flex1" onclick="saveNewRepAccount()">حفظ المندوب</button><button class="btn btn-ghost" onclick="state._showAddRep=false;render();">إلغاء</button></div>
    </div>` : `<button class="btn btn-gold btn-block" style="margin-top:6px;" onclick="state._showAddRep=true;render();">➕ إضافة مندوب</button>`;
  html += `<div class="card" style="padding:12px;margin-top:14px;"><div class="row-sub">📲 المندوب بينزّل «دفتر» من Google Play، وبيعمل حساب بنفس الإيميل اللي حطيته هون، وبيأكّد إيميله. بعدها بيفتحله التطبيق كمندوب لحاله.</div></div>`;
  return html;
}
function saveNewRepAccount() {
  const name = (document.getElementById("nrep-name").value || "").trim();
  const email = (document.getElementById("nrep-email").value || "").trim().toLowerCase();
  const place = document.getElementById("nrep-place").value || "__main__";
  if (!name || !email) { flash("اكتب اسم المندوب وإيميله"); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { flash("الإيميل مكتوب غلط"); return; }
  const myEmail = repEmailOf(authUser || {});
  if (email === myEmail) { flash("هاد إيميلك انت — المندوب لازم يكون إله إيميل خاص"); return; }
  const reps = loadKey("reps", []) || [];
  if (reps.some((r) => r.email === email)) { flash("هاد الإيميل مضاف أصلاً كمندوب"); return; }
  reps.push({ id: uid(), name, email, warehouseId: place, accountId: state.activeAccountId, permissions: repDefaultPerms(), customerIds: [] });
  saveKey("reps", reps);
  state._showAddRep = false;
  flash("✅ تمت إضافة المندوب");
  repStartInbox();
  scheduleRepPublish(300);
  render();
}
function deleteRepAccount(id) {
  const reps = loadKey("reps", []) || [];
  const r = reps.find((x) => x.id === id);
  if (!r) return;
  if (!confirm(`متأكد بدك تشيل المندوب ${r.name}؟ ما رح يقدر يدخل بعدها، وحركاته القديمة بتضل عندك.`)) return;
  const tb = syncLoadTombs(); tb["reps|" + id] = { at: Date.now(), acc: r.accountId }; syncSaveTombs(tb);
  saveKey("reps", reps.filter((x) => x.id !== id));
  if (r.email) repRemoveCloud(r.email);
  flash("تم حذف المندوب");
  render();
}
if (REP_MODE) {
  window.addEventListener("online", () => repFlush());
  setInterval(() => repFlush(), 30000);
}

/* ===================== INITIAL RENDER ===================== */
i18nStart();
authInit();
render();
</script>
</body>
</html>
