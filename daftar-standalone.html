<style>
  :root {
    --paper:#EDE7D8; --paperLight:#F8F4E9; --card:#FFFFFF;
    --ink:#232A22; --inkSoft:#5B6357;
    --green:#2F5233; --greenDark:#233F27; --greenLight:#E4EAE1;
    --stamp:#B23A2E; --stampLight:#F6E1DE;
    --gold:#A9782F; --goldLight:#F3E7CF;
    --line:#D6CDB2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: -apple-system, Roboto, "Segoe UI", sans-serif; }
  .mono { font-family: "Courier New", monospace; }
  input.mono { direction: ltr; text-align: left; unicode-bidi: plaintext; }
  .display { font-weight:700; }
  header.app-header { background:var(--greenDark); color:#fff; position:sticky; top:0; z-index:40; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .header-inner { max-width:720px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .header-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .icon-btn { background:transparent; border:none; color:#fff; cursor:pointer; padding:8px; border-radius:8px; }
  .icon-btn:active { background:rgba(255,255,255,.15); }
  .badge-btn { width:36px; height:36px; border-radius:8px; background:var(--gold); border:none; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }
  main.app-main { max-width:720px; margin:0 auto; padding:14px 12px 40px; }
  h1,h2,h3,h4 { margin:0; }
  .title { font-size:18px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subtle-link { background:none; border:none; color:#C9D6C6; font-size:11px; padding:0; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .tile .circle { width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:22px; }

  .stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .stat-label { font-size:10.5px; color:var(--inkSoft); display:flex; justify-content:space-between; }
  .stat-value { font-weight:700; font-size:14px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .list-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--line); }
  .list-row:first-child { border-top:none; }
  .flex1 { flex:1; min-width:0; }
  .truncate { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-title { font-weight:600; font-size:14px; }
  .row-sub { font-size:11px; color:var(--inkSoft); }
  input, select, textarea { font-family:inherit; font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  label.field { display:block; margin-bottom:10px; }
  label.field .lbl { display:block; font-size:11.5px; color:var(--inkSoft); margin-bottom:4px; }
  .btn { border:none; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-stamp { background:var(--stampLight); color:var(--stamp); }
  .btn-gold { background:var(--goldLight); color:var(--gold); }
  .btn-ghost { background:var(--paperLight); border:1px solid var(--line); color:var(--inkSoft); }
  .btn-block { width:100%; display:block; text-align:center; }
  .btn-disabled { background:var(--line); color:var(--inkSoft); }
  .row-flex { display:flex; gap:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .search-wrap { position:relative; }
  .search-wrap input { padding-right:34px; }
  .search-icon { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--inkSoft); }
  .product-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  @media(min-width:520px){ .product-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .product-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:right; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .product-card:disabled, .product-card.disabled { opacity:.5; }
  .chip { display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; }
  .cart-card { background:var(--paperLight); border:1px solid var(--line); border-radius:10px; margin-top:14px; }
  .cart-head { padding:14px; text-align:center; border-bottom:1px dashed var(--line); position:relative; }
  .cart-items { padding:10px 14px; max-height:220px; overflow-y:auto; }

  .qty-btn { width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .cart-totals { padding:10px 14px; border-top:1px dashed var(--line); }
  .cart-foot { padding:10px 14px 14px; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; }
  .empty { text-align:center; padding:40px 10px; color:var(--inkSoft); }
  .empty.small { padding:20px 10px; }
  .empty .emoji { font-size:30px; margin-bottom:8px; }
  .section-title { font-size:14px; font-weight:700; margin:16px 0 8px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; } }
  .modal-box { background:var(--paperLight); color:var(--ink); width:100%; max-width:440px; max-height:88vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:20px; }
  @media(min-width:640px){ .modal-box{ border-radius:16px; } }
  .modal-title-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .close-x { background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink); }
  .tabbar { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .tab-pill { padding:6px 14px; border-radius:999px; font-size:12px; white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--inkSoft); cursor:pointer; }
  .tab-pill.active { background:var(--green); color:#fff; border-color:var(--green); }
  .toggle { width:40px; height:22px; border-radius:999px; border:none; position:relative; cursor:pointer; }
  .toggle .knob { position:absolute; top:2px; width:16px; height:16px; border-radius:999px; background:#fff; transition:right .15s; }
  .flash { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  .floating-bar { position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--greenDark); color:#fff; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; box-shadow:0 -4px 12px rgba(0,0,0,.2); cursor:pointer; }
  .floating-bar .fb-info { display:flex; flex-direction:column; }
  .floating-bar .fb-count { font-size:11px; color:#C9D6C6; }
  .floating-bar .fb-total { font-size:16px; font-weight:700; font-family:"Courier New",monospace; }
  .floating-bar .fb-btn { background:var(--gold); color:var(--greenDark); border:none; border-radius:8px; padding:9px 18px; font-weight:700; font-size:13.5px; }
  .scroll-pad-bottom { padding-bottom:76px; }
  @media print {
    body > *:not(#print-root) { display:none !important; }
    #print-root { position:static !important; visibility:visible; width:100%; padding:16px; background:#fff; color:#111; }
    #print-root * { visibility:visible; }
    .no-print { display:none !important; }
    .print-area tr, .print-area .print-row, .print-area .print-card { page-break-inside:avoid; break-inside:avoid; }
    .print-area table { page-break-inside:auto; }
    .print-area thead { display:table-header-group; }
    html, body { height:auto !important; overflow:visible !important; }
  }
</style>

<body>
<div id="app"></div>
<div id="flash-holder"></div>

<script>
/* ===================== STORAGE ===================== */
const LS_PREFIX = "daftar_";
function loadKey(key, fallback) {
  try { const raw = localStorage.getItem(LS_PREFIX + key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveKey(key, value) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error("saveKey failed", key, e);
    cloudSyncBlocked = true;
    clearTimeout(cloudSyncTimer);
    flash("⚠️ فشل الحفظ! مساحة تخزين تليفونك ممتلئة تقريبًا — امسح صور فواتير قديمة مش محتاجها عشان تفضى مكان");
    return false;
  }
  cloudSyncBlocked = false;
  localLastModifiedAt = Date.now();
  cloudScheduleSync();
  return true;
}

/* ===================== CLOUD SYNC (Firebase) ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDrQ2rx7FM5cjoLqAAif7BJiFIHEL8hh2c",
  authDomain: "daftar-app-e0c7e.firebaseapp.com",
  projectId: "daftar-app-e0c7e",
  storageBucket: "daftar-app-e0c7e.firebasestorage.app",
  messagingSenderId: "727145520285",
  appId: "1:727145520285:web:29ff2ba1cacb33877cc874",
};
let cloudDb = null;
let cloudUnsub = null;
let cloudSyncTimer = null;
let cloudApplyingRemote = false; // يمنع حلقة تكرار: كتابة محلية → سحابة → رجوع محلي
let cloudSyncBlocked = false; // يمنع رفع نسخة ناقصة للسحابة لما يفشل حفظ محلي (تخزين ممتلئ)
let localLastModifiedAt = 0; // آخر وقت حصل فيه تعديل محلي (يحمي من إن نسخة سحابة قديمة تمسح تعديل حديث)
let cloudPushInFlight = false; // صحيح أثناء إرسال آخر نسخة للسحابة (لحد ما يتأكد نجح الإرسال)

function cloudInit() {
  if (cloudDb) return cloudDb;
  try {
    if (!window.firebase.apps || !window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
    cloudDb = window.firebase.firestore();
  } catch (e) { console.error("cloud init failed", e); }
  return cloudDb;
}
let cloudStorageRef = null;
function cloudInitStorage() {
  if (cloudStorageRef) return cloudStorageRef;
  try {
    if (!window.firebase.apps || !window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
    cloudStorageRef = window.firebase.storage();
  } catch (e) { console.error("storage init failed", e); }
  return cloudStorageRef;
}
function dataUrlToBlob(dataUrl) {
  const parts = dataUrl.split(",");
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  const arr = new Uint8Array(bstr.length);
  for (let i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function uploadPhotoToStorage(dataUrl, onDone) {
  const linkId = cloudGetLinkId();
  const storage = cloudInitStorage();
  if (!linkId || !storage) { onDone(dataUrl, false); return; } // مفيش مزامنة مفعّلة -> خزّنها محليًا زي القديم
  try {
    const blob = dataUrlToBlob(dataUrl);
    const path = `photos/${linkId}/${uid()}.jpg`;
    const ref = storage.ref(path);
    ref.put(blob).then((snap) => snap.ref.getDownloadURL()).then((url) => onDone(url, true)).catch((e) => {
      console.error("photo upload failed", e);
      onDone(dataUrl, false); // فشل الرفع -> ارجع للتخزين المحلي بدل ما تضيع الصورة
    });
  } catch (e) {
    console.error("photo upload failed", e);
    onDone(dataUrl, false);
  }
}
// بيرفع الصورة في الخلفية من غير ما يوقّف حفظ الفاتورة، وبيحدّث السجل بالرابط النهائي أول ما يخلص
function uploadPhotoInBackground(recordKey, recordId, localDataUrl) {
  uploadPhotoToStorage(localDataUrl, (finalUrl, uploaded) => {
    if (!uploaded) return; // فشل الرفع -> سيب الصورة المحلية زي ما هي، مفيش داعي نلمس السجل
    const arr = loadKey(recordKey, []) || [];
    const idx = arr.findIndex((x) => x.id === recordId);
    if (idx === -1) return; // اتحذفت الفاتورة أو اتعدلت قبل ما الرفع يخلص
    arr[idx] = { ...arr[idx], photo: finalUrl };
    saveKey(recordKey, arr);
    if (DB[recordKey]) DB[recordKey] = arr;
    if (state.modal) render(); // حدّث الشاشة لو المستخدم لسه واقف عليها
  });
}
function cloudGetLinkId() { return loadKey("cloudLinkId", null); }
function cloudSetLinkId(id) { try { localStorage.setItem(LS_PREFIX + "cloudLinkId", JSON.stringify(id)); } catch (e) {} }
function cloudIsEnabled() { return !!cloudGetLinkId(); }

function cloudSnapshotAll() {
  const snap = {};
  BACKUP_KEYS.forEach((k) => { snap[k] = loadKey(k, null); });
  snap._updatedAt = Date.now();
  return snap;
}
function cloudScheduleSync() {
  if (!cloudIsEnabled() || cloudApplyingRemote || cloudSyncBlocked) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(cloudPushNow, 900);
}
function cloudPushNow() {
  if (cloudSyncBlocked) return;
  const db = cloudInit();
  const linkId = cloudGetLinkId();
  if (!db || !linkId) return;
  db.collection("daftar_accounts").doc(linkId).set(cloudSnapshotAll(), { merge: false })
    .then(() => { cloudPushFailed = false; })
    .catch((e) => {
      console.error("cloud push failed", e);
      cloudPushFailed = true;
      const sizeIssue = e && (e.code === "invalid-argument" || /size|exceed|too large|too big/i.test(e.message || ""));
      flash(sizeIssue
        ? "❌ فشلت المزامنة! حجم البيانات كبير جدًا (غالبًا بسبب الصور القديمة) — لازم نصغّرها"
        : "❌ فشلت المزامنة مع السحابة — تأكد من الاتصال بالإنترنت");
    });
}
let cloudPushFailed = false;
let recentlyAddedGuard = []; // {key, id, item, ts} — حماية إضافية لأي سجل جديد لمدة 45 ثانية بعد إضافته
const RECENT_GUARD_MS = 45000;
function protectRecentlyAdded(key, item) {
  recentlyAddedGuard.push({ key, id: item.id, item, ts: Date.now() });
  recentlyAddedGuard = recentlyAddedGuard.filter((r) => Date.now() - r.ts < RECENT_GUARD_MS);
}
function cloudApplySnapshot(data) {
  if (!data) return;
  // لو الجهاز عنده تعديل محلي أحدث من نسخة السحابة دي، تجاهلها عشان ما تمسحش التعديل الحديث
  if (data._updatedAt && data._updatedAt < localLastModifiedAt) return;
  // لو المستخدم لسه بيبني فاتورة (سلة فيها أصناف) أو واقف في نافذة إدخال بيانات، أجّل التحديث عشان ما نقطعش شغله
  const cartBusy = (state.cart && state.cart.length > 0) || (state.pcart && state.pcart.length > 0);
  const modalBusy = state.modal && ["saleCart", "purchaseCart", "repCollect", "repHandover"].includes(state.modal.type);
  if (cartBusy || modalBusy) { pendingCloudSnapshot = data; return; }
  cloudApplyingRemote = true;
  try {
    Object.keys(data).forEach((k) => {
      if (k === "_updatedAt") return;
      if (data[k] !== undefined) localStorage.setItem(LS_PREFIX + k, JSON.stringify(data[k]));
    });
    // حماية إضافية: أي سجل حديث (آخر 45 ثانية) لازم يفضل موجود حتى لو النسخة الجديدة مش فيها
    recentlyAddedGuard = recentlyAddedGuard.filter((r) => Date.now() - r.ts < RECENT_GUARD_MS);
    let restoredAny = false;
    recentlyAddedGuard.forEach((r) => {
      const arr = loadKey(r.key, []) || [];
      if (!arr.some((x) => x.id === r.id)) {
        arr.unshift(r.item);
        try { localStorage.setItem(LS_PREFIX + r.key, JSON.stringify(arr)); } catch (e) {}
        restoredAny = true;
      }
    });
    bootDB();
    if (restoredAny) cloudScheduleSync();
    render();
  } finally {
    cloudApplyingRemote = false;
  }
}
let pendingCloudSnapshot = null;
// يطبّق أي تحديث سحابة كان متأجّل، بعد ما المستخدم يخلص شغله (يقفل النافذة أو يفضي السلة)
function applyPendingCloudSnapshotIfSafe() {
  if (!pendingCloudSnapshot) return;
  const cartBusy = (state.cart && state.cart.length > 0) || (state.pcart && state.pcart.length > 0);
  const modalBusy = state.modal && ["saleCart", "purchaseCart", "repCollect", "repHandover"].includes(state.modal.type);
  if (cartBusy || modalBusy) return;
  const d = pendingCloudSnapshot;
  pendingCloudSnapshot = null;
  cloudApplySnapshot(d);
}
function cloudStartListening() {
  const db = cloudInit();
  const linkId = cloudGetLinkId();
  if (!db || !linkId) return;
  if (cloudUnsub) cloudUnsub();
  cloudUnsub = db.collection("daftar_accounts").doc(linkId).onSnapshot((doc) => {
    if (doc.exists) cloudApplySnapshot(doc.data());
  }, (e) => console.error("cloud listen failed", e));
}
function cloudGetOwnerPin() { return loadKey("cloudOwnerPin", null); }
function cloudSetOwnerPin(pin) { saveKey("cloudOwnerPin", pin); }
function cloudEnableForOwner() {
  const linkId = cloudGetLinkId() || (uid() + uid());
  cloudSetLinkId(linkId);
  if (!cloudGetOwnerPin()) cloudSetOwnerPin(String(Math.floor(1000 + Math.random() * 9000)));
  cloudPushNow();
  cloudStartListening();
  flash("تم تفعيل المزامنة السحابية");
  render();
}
function cloudDisable() {
  if (cloudUnsub) { cloudUnsub(); cloudUnsub = null; }
  cloudSetLinkId(null);
  flash("تم إيقاف المزامنة السحابية");
  render();
}
function saveOwnerPinFromForm() {
  const pin = (document.getElementById("owner-pin-input").value || "").trim();
  if (!pin) { flash("اكتب رقم سري"); return; }
  cloudSetOwnerPin(pin);
  cloudPushNow();
  flash("تم تحديث الرقم السري");
  render();
}
async function cloudTryLogin(linkId, pin) {
  const db = cloudInit();
  if (!db) { flash("تعذّر الاتصال بالسحابة"); return false; }
  try {
    const doc = await db.collection("daftar_accounts").doc(linkId).get();
    if (!doc.exists) { flash("الرمز غير صحيح — تأكد من الرمز اللي أعطاك إياه صاحب الشركة"); return false; }
    const data = doc.data();
    if (data.cloudOwnerPin && pin === data.cloudOwnerPin) {
      cloudSetLinkId(linkId);
      sessionStorage.setItem("daftar_isOwner", "1");
      sessionStorage.removeItem("daftar_repId");
      cloudApplySnapshot(data);
      if (DB.accounts && DB.accounts.length) state.activeAccountId = DB.accounts[0].id;
      cloudStartListening();
      return true;
    }
    const reps = data.reps || [];
    const rep = reps.find((r) => r.pin === pin);
    if (!rep) { flash("الرقم السري غير صحيح"); return false; }
    cloudSetLinkId(linkId);
    sessionStorage.setItem("daftar_repId", rep.id);
    sessionStorage.removeItem("daftar_isOwner");
    cloudApplySnapshot(data);
    const repAccount = rep.accountId && (DB.accounts || []).find((a) => a.id === rep.accountId);
    state.activeAccountId = repAccount ? rep.accountId : (DB.accounts && DB.accounts.length ? DB.accounts[0].id : null);
    cloudStartListening();
    return true;
  } catch (e) {
    console.error(e);
    flash("حصل خطأ (" + (e && e.message ? e.message : "غير معروف") + ") — تأكد من الاتصال بالإنترنت");
    return false;
  }
}
function isOwnerCloudSession() { return sessionStorage.getItem("daftar_isOwner") === "1"; }
function ownerCloudLogout() { sessionStorage.removeItem("daftar_isOwner"); state.activeAccountId = null; render(); }
function currentRepId() { return sessionStorage.getItem("daftar_repId"); }
function currentRep() {
  const rid = currentRepId();
  if (!rid) return null;
  return (loadKey("reps", []) || []).find((r) => r.id === rid) || null;
}
function repLogout() { sessionStorage.removeItem("daftar_repId"); render(); }

/* ===================== HELPERS ===================== */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (n) => (Number.isFinite(n) ? n : 0).toFixed(2);
const shortId = (id) => id.slice(-5).toUpperCase();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function todayStr(ts) { return new Date(ts).toDateString(); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString("ar-EG"); }

/* ===================== BACKUP / RESTORE ===================== */
const BACKUP_KEYS = ["accounts", "products", "suppliers", "customers", "purchases", "sales", "expenses", "vouchers", "manualCash", "checks", "capital", "warehouses", "warehouseEntries", "employees", "employeeTx", "settingsMap", "reps", "cashHandovers", "cloudOwnerPin"];
function exportBackup() {
  const payload = { app: "daftar", version: 1, exportedAt: new Date().toISOString() };
  BACKUP_KEYS.forEach((k) => { payload[k] = DB[k]; });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `daftar-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash("تم تصدير النسخة الاحتياطية");
}
function triggerImport() { document.getElementById("backup-file-input").click(); }
function importBackupFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { applyBackupPayload(e.target.result); };
  reader.readAsText(file);
  input.value = "";
}
function applyBackupPayload(rawText) {
  try {
    const payload = JSON.parse(rawText);
    if (!payload || payload.app !== "daftar" || !Array.isArray(payload.accounts)) {
      flash("النص/الملف غير صالح");
      return;
    }
    BACKUP_KEYS.forEach((k) => { DB[k] = payload[k] || (k === "settingsMap" ? {} : []); persist(k); });
    state.activeAccountId = null;
    state.screen = "home";
    state.modal = null;
    flash("تم استيراد النسخة الاحتياطية بنجاح");
    render();
  } catch (err) {
    flash("تعذّر قراءة النص — تأكد إنه منسوخ كامل");
  }
}
function openImportTextModal() { state.modal = { type: "importText" }; render(); }
function submitImportText() {
  const txt = document.getElementById("import-text-area").value.trim();
  if (!txt) return;
  applyBackupPayload(txt);
}

/* scope helpers: get/set items belonging to the active account */
function scoped(key) { return DB[key].filter((x) => x.accountId === state.activeAccountId); }
function persistScoped(key, newItemsForAccount) {
  DB[key] = [...DB[key].filter((x) => x.accountId !== state.activeAccountId), ...newItemsForAccount.map((x) => ({ ...x, accountId: state.activeAccountId }))];

}
function addScoped(key, item) {

  if (ok) protectRecentlyAdded(key, tagged);

}

function customerBalance(c) {
  const salesTotal = scoped("sales").filter((s) => s.customerId === c.id).reduce((a, s) => a + (s.total - s.paidNow), 0);
  const paid = scoped("vouchers").filter((v) => v.partyKind === "customer" && v.partyId === c.id).reduce((a, v) => a + v.amount, 0);
  return (c.opening || 0) + salesTotal - paid;
}
function supplierBalance(s0) {
  const purTotal = scoped("purchases").filter((p) => p.supplierId === s0.id).reduce((a, p) => a + (p.total - p.paidNow), 0);
  const paid = scoped("vouchers").filter((v) => v.partyKind === "supplier" && v.partyId === s0.id).reduce((a, v) => a + v.amount, 0);
  return (s0.opening || 0) + purTotal - paid;
}
function cashLedger() {
  const settings = currentSettings();
  const entries = [];
  if (settings.autoSales) {
    scoped("sales").forEach((s) => { if (s.paidNow > 0 && !s.checkPayment && !s.repId) entries.push({ id: "s" + s.id, ts: s.ts, type: "in", amount: s.paidNow, desc: `مبيعات فاتورة #${shortId(s.id)}`, source: "sale" }); });
    scoped("vouchers").filter((v) => v.partyKind === "customer" && v.method !== "check" && !v.repId).forEach((v) => {
      const cashPart = typeof v.cashAmount === "number" ? v.cashAmount : v.amount;
      if (cashPart > 0) entries.push({ id: "v" + v.id, ts: v.ts, type: "in", amount: cashPart, desc: `تحصيل: ${v.partyName}`, source: "receipt" });
    });
  }
  if (settings.autoPurchases) {
    scoped("purchases").forEach((p) => { if (p.paidNow > 0) entries.push({ id: "p" + p.id, ts: p.ts, type: "out", amount: p.paidNow, desc: `مشتريات فاتورة #${shortId(p.id)}`, source: "purchase" }); });
    scoped("vouchers").filter((v) => v.partyKind === "supplier" && v.method !== "check").forEach((v) => entries.push({ id: "v" + v.id, ts: v.ts, type: "out", amount: v.amount, desc: `دفع: ${v.partyName}`, source: "payment" }));
  }
  if (settings.autoExpenses) {
    scoped("expenses").filter((e) => e.method === "cashbox").forEach((e) => entries.push({ id: "e" + e.id, ts: e.ts, type: "out", amount: e.amount, desc: `مصروف: ${e.account}`, source: "expense" }));
  }
  scoped("manualCash").forEach((m) => entries.push({ id: "m" + m.id, ts: m.ts, type: m.type, amount: m.amount, desc: m.desc || "حركة يدوية", source: "manual" }));
  entries.sort((a, b) => new Date(b.ts) - new Date(a.ts));
  return entries;
}
function cashBalance() { return cashLedger().reduce((a, e) => a + (e.type === "in" ? e.amount : -e.amount), 0); }

/* ===================== RENDER ROOT ===================== */
function render() {
  // preserve focus + cursor + scroll position across the full innerHTML re-render,
  // otherwise typing in any input loses focus (and closes the keyboard on mobile) every keystroke.
  const active = document.activeElement;
  const activeId = active && active.id;
  let selStart = null, selEnd = null;
  try {
    selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  } catch (e) { /* type="text" inputmode="decimal" inputs throw when reading selection — ignore, just skip cursor restore */ }
  const scrollY = window.scrollY;

  renderFlashOnly();
  const app = document.getElementById("app");
  if (state.isRepEntry) {
    app.innerHTML = isOwnerCloudSession() ? (renderHeader() + `<main class="app-main">${renderScreen()}</main>` + renderFloatingBar() + renderModal())
      : currentRepId() ? renderRepDashboard() : renderRepLogin();
  } else if (!state.activeAccountId) {
    app.innerHTML = renderAccountsHeader() + `<main class="app-main">${renderAccountsScreen()}</main>` + renderModal();
  } else {
    app.innerHTML = renderHeader() + `<main class="app-main">${renderScreen()}</main>` + renderFloatingBar() + renderModal();
  }
  afterRenderHooks();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT")) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
  window.scrollTo(0, scrollY);
}
function afterRenderHooks() {
  if (state.modal && state.modal.type === "scan" && !state.modal._started) {
    state.modal._started = true;
    startScanner(state.modal.onDetect);
  }
}

function repOpenHandover() {

function repHandoverModalHtml() {
  const rep = currentRep();
  if (!rep) return "";
  const settings = currentSettings();
  const mySales = scoped("sales").filter((s) => s.repId === rep.id);
  const myVouchers = scoped("vouchers").filter((v) => v.repId === rep.id);
  const todayStr0 = new Date().toDateString();
  const cashSalesToday = mySales.filter((s) => s.payType === "cash" && new Date(s.ts).toDateString() === todayStr0).reduce((a, s) => a + s.paidNow, 0);
  const cashVouchersToday = myVouchers.filter((v) => v.method !== "check" && new Date(v.ts).toDateString() === todayStr0).reduce((a, v) => a + (v.cashAmount ?? v.amount), 0);
  const myHandoversToday = (loadKey("cashHandovers", []) || []).filter((h) => h.repId === rep.id && new Date(h.ts).toDateString() === todayStr0 && h.status !== "rejected");
  const handedOverToday = myHandoversToday.reduce((a, h) => a + h.amount, 0);
  const cashToday = cashSalesToday + cashVouchersToday - handedOverToday;
  return `<div class="modal-title-row"><h3>📤 تسليم الكاش</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="card" style="padding:16px;text-align:center;background:var(--greenLight);margin-bottom:14px;">
      <div class="row-sub">المبلغ اللي معاك دلوقتي</div>
      <div class="mono" style="font-weight:700;font-size:26px;color:var(--green);">${fmt(cashToday)} ${esc(settings.currency)}</div>
    </div>
    <div class="row-sub" style="margin-bottom:14px;">بعد ما تدوس تأكيد، هيوصل طلب لصاحب الشركة إنك سلّمته ${fmt(cashToday)} دينار كاش — وهو اللي هيأكّد استلامه.</div>
    <button class="btn btn-green btn-block" onclick="repSubmitHandover(${cashToday})">تأكيد طلب التسليم</button>`;
}
function repSubmitHandover(amount) {
  const rep = currentRep();
  if (!rep || amount <= 0) { flash("مفيش كاش تسلمه دلوقتي"); return; }
  const handovers = loadKey("cashHandovers", []) || [];
  handovers.push({ id: uid(), repId: rep.id, repName: rep.name, amount, ts: new Date().toISOString(), status: "pending" });
  saveKey("cashHandovers", handovers);
  flash("تم إرسال طلب التسليم — في انتظار تأكيد صاحب الشركة");
  closeModal();
}
function confirmHandover(handoverId) {
  const handovers = loadKey("cashHandovers", []) || [];
  const h = handovers.find((x) => x.id === handoverId);
  if (!h || h.status !== "pending") return;
  h.status = "confirmed"; h.confirmedAt = new Date().toISOString();
  saveKey("cashHandovers", handovers);
  addScoped("manualCash", { id: uid(), ts: new Date().toISOString(), type: "in", amount: h.amount, desc: `تسليم كاش من المندوب: ${h.repName}` });
  flash(`تم تأكيد استلام ${fmt(h.amount)} من ${h.repName}`);
  render();
}
function rejectHandover(handoverId) {
  const handovers = loadKey("cashHandovers", []) || [];
  const h = handovers.find((x) => x.id === handoverId);
  if (!h) return;
  h.status = "rejected";
  saveKey("cashHandovers", handovers);
  flash("تم رفض الطلب");
  render();
}

      ${weights.map((w) => `<button class="btn ${weight === w ? "btn-green" : "btn-ghost"}" style="padding:5px 10px;font-size:11px;" onclick="state._calcWeight=${w};render();">${w} كغ</button>`).join("")}
    </div>
    <div class="card" style="padding:14px;text-align:center;background:var(--greenDark);color:#fff;margin-bottom:14px;">
      <div style="font-size:12px;color:#C9D6C6;">${perKg} × ${weight} =</div>
      <div class="mono" style="font-weight:700;font-size:24px;">${fmt(result)}</div>
    </div>
    <button class="btn btn-green btn-block" onclick="applyPriceCalc('${cartType}','${productId}')">استخدام هذا السعر</button>`;
}
function applyPriceCalc(cartType, productId) {
  const perKg = parseFloat(state._calcPerKg) || 0;
  const weight = parseFloat(state._calcWeight) || 0;
  const result = perKg * weight;
  if (cartType === "sale") changeCartPrice(productId, result);
  else changePCartCost(productId, result);
  state.modal = { type: cartType === "sale" ? "saleCart" : "purchaseCart" };
  render();
}
function addToCart(productId) {
  const p = scoped("products").find((x) => x.id === productId);
  if (!p || p.stock <= 0) return;
  const ex = state.cart.find((c) => c.productId === productId);
  if (ex) { if (ex.qty < p.stock) ex.qty++; }
  else state.cart.push({ productId: p.id, name: p.name, price: p.price, qty: 1, stock: p.stock });
  render();
}
function changeCartQty(productId, d) {
  const item = state.cart.find((c) => c.productId === productId);
  if (!item) return;
  item.qty = Math.min(item.stock, Math.max(1, item.qty + d));
  render();
}
function setCartQty(productId, val) {
  const item = state.cart.find((c) => c.productId === productId);
  if (!item) return;
  const n = parseFloat(val) || 1;
  item.qty = Math.min(item.stock, Math.max(1, n));
  render();
}
function changeCartPrice(productId, val) {
  const item = state.cart.find((c) => c.productId === productId);
  if (!item) return;
  item.price = parseFloat(val) || 0;
  render();
}
function removeFromCart(productId) { state.cart = state.cart.filter((c) => c.productId !== productId); render(); }
function setSalePayType(t) {
  state.saleForm.payType = t;
  const settings = currentSettings();
  let total;
  if (state.saleForm.quickMode) total = parseFloat(state.saleForm.quickTotal) || 0;
  else { const subtotal = state.cart.reduce((a, c) => a + c.price * c.qty, 0); total = subtotal * (1 + (settings.taxRate || 0) / 100); }
  state.saleForm.paidNow = t === "cash" ? String(total || "") : "";
  if (t === "check" && (!state._checkRows || !state._checkRows.length)) addCheckRow();
  render();
}
function resetSaleForm() {
  state.cart = []; state.saleForm = { customerId: "", payType: "cash", paidNow: "", quickMode: false, invoiceNo: "", quickTotal: "", photo: null }; state.editingSaleId = null;
  state._repLockedWarehouse = false; state._activeRepId = null;
  if (state.modal && state.modal.type === "saleCart") state.modal = null;
  render();
  applyPendingCloudSnapshotIfSafe();
}
function completeSale() {
  if (state.saleForm.quickMode) return completeQuickSale();
  const settings = currentSettings();
  const subtotal = state.cart.reduce((a, c) => a + c.price * c.qty, 0);
  const tax = subtotal * ((settings.taxRate || 0) / 100);
  const discount = parseFloat(state.saleForm.discount) || 0;
  const total = Math.max(0, subtotal + tax - discount);
  const customerId = state.saleForm.customerId || null;
  const payType = state.saleForm.payType;
  const isCheck = payType === "check";
  const paidNum = isCheck ? sumCheckRows() : (parseFloat(state.saleForm.paidNow) || 0);
  const canSubmit = state.cart.length > 0 && (payType === "cash" ? paidNum >= total : payType === "check" ? (customerId && paidNum > 0) : customerId);
  if (!canSubmit) return;

  const sourceWarehouseId = state.editingSaleId ? null : (state.saleForm.sourceWarehouseId || null);
  const sourceWarehouse = sourceWarehouseId ? scoped("warehouses").find((w) => w.id === sourceWarehouseId) : null;

  if (sourceWarehouseId) {
    // تحقق إن كل صنف متوفر بالكمية الكافية في المستودع المختار قبل الإتمام
    for (const c of state.cart) {
      const entries = scoped("warehouseEntries").filter((e) => e.warehouseId === sourceWarehouseId && e.productName === c.name);
      const available = entries.reduce((a, e) => a + (e.type === "in" ? e.qty : -e.qty), 0);
      if (c.qty > available) { flash(`ما ينفعش — المتوفر في ${sourceWarehouse ? sourceWarehouse.name : "المستودع"} بس ${fmt(available)} من "${c.name}"`); return; }
    }
  } else {
    // تحقق إن كل صنف متوفر بالكمية الكافية في مخزون المحل الرئيسي قبل الإتمام
    const oldQtyById = {};
    if (state.editingSaleId) {
      const oldSale = scoped("sales").find((s) => s.id === state.editingSaleId);
      if (oldSale && !oldSale.sourceWarehouseId) oldSale.items.forEach((it) => { oldQtyById[it.productId] = (oldQtyById[it.productId] || 0) + it.qty; });
    }
    for (const c of state.cart) {
      const product = scoped("products").find((p) => p.id === c.productId);
      const availableForThis = (product ? product.stock : 0) + (oldQtyById[c.productId] || 0);
      if (c.qty > availableForThis) { flash(`ما ينفعش — المتوفر بالمحل بس ${fmt(availableForThis)} من "${c.name}"`); return; }
    }
  }

  const products = scoped("products");
  let sale;
  if (state.editingSaleId) {
    const oldSale = scoped("sales").find((s) => s.id === state.editingSaleId);
    if (!oldSale.sourceWarehouseId) {
      const delta = {};
      oldSale.items.forEach((it) => { delta[it.productId] = (delta[it.productId] || 0) + it.qty; });
      state.cart.forEach((c) => { delta[c.productId] = (delta[c.productId] || 0) - c.qty; });
      const newProducts = products.map((p) => (delta[p.id] ? { ...p, stock: p.stock + delta[p.id] } : p));
      persistScoped("products", newProducts);
    }
    sale = { ...oldSale, customerId, items: state.cart.map((c) => ({ productId: c.productId, name: c.name, price: c.price, qty: c.qty })), subtotal, tax, discount, total, paidNow: paidNum, payType: isCheck ? "credit" : payType, checkPayment: isCheck };
    persistScoped("sales", scoped("sales").map((s) => (s.id === state.editingSaleId ? sale : s)));
    flash("تم تحديث الفاتورة");
  } else {
    if (sourceWarehouseId) {
      state.cart.forEach((c) => {
        addScoped("warehouseEntries", { id: uid(), warehouseId: sourceWarehouseId, ts: new Date().toISOString(), type: "out", productName: c.name, qty: c.qty, unit: "", party: "", note: "بيع فاتورة" });
      });
    } else {
      const newProducts = products.map((p) => { const it = state.cart.find((c) => c.productId === p.id); return it ? { ...p, stock: p.stock - it.qty } : p; });
      persistScoped("products", newProducts);
    }
    sale = { id: uid(), ts: new Date().toISOString(), customerId, items: state.cart.map((c) => ({ productId: c.productId, name: c.name, price: c.price, qty: c.qty })), subtotal, tax, discount, total, paidNow: paidNum, payType: isCheck ? "credit" : payType, checkPayment: isCheck, sourceWarehouseId: sourceWarehouseId || undefined, repId: state._activeRepId || undefined };
    addScoped("sales", sale);
    if (settings.autoPrintSale) {
      const partyName = customerId ? ((scoped("customers").find((c) => c.id === customerId) || {}).name || "") : "عميل نقدي";
      setTimeout(() => printInvoice({ ...sale, partyName }, "sale"), 300);
    }
    flash(isCheck ? "تم تسجيل الفاتورة والشيكات" : payType === "credit" ? "تم تسجيل فاتورة آجلة" : "تمت عملية البيع");
  }

  if (isCheck) {
    const party = scoped("customers").find((c) => c.id === customerId);
    (state._checkRows || []).filter((r) => (parseFloat(r.amount) || 0) > 0).forEach((r) => {
      addScoped("checks", {
        id: uid(), ts: new Date().toISOString(), dueDate: r.dueDate || "", amount: parseFloat(r.amount) || 0,
        checkNo: r.checkNo || "", bank: r.bank || "", photo: r.photo || null,
        desc: `شيك من: ${party ? party.name : ""}${r.checkNo ? " — رقم " + r.checkNo : ""}${r.bank ? " — " + r.bank : ""}`,
        status: "pending", saleId: sale.id,
      });
    });
    state._checkRows = [];
  }
  resetSaleForm();
}
function completeQuickSale() {
  const settings = currentSettings();
  const total = parseFloat(state.saleForm.quickTotal) || 0;
  const customerId = state.saleForm.customerId || null;
  const payType = state.saleForm.payType;
  const isCheck = payType === "check";
  const paidNum = isCheck ? sumCheckRows() : (parseFloat(state.saleForm.paidNow) || 0);
  if (total <= 0) { flash("⚠️ لازم تحط المبلغ الأول"); return; }
  if (payType === "cash" && paidNum < total) { flash("⚠️ المبلغ المدفوع أقل من الإجمالي"); return; }
  if (payType === "credit" && !customerId) { flash("⚠️ لازم تختار اسم العميل الأول (الفاتورة آجل)"); return; }
  if (isCheck && !customerId) { flash("⚠️ لازم تختار اسم العميل الأول (فاتورة بشيك)"); return; }
  if (isCheck && paidNum <= 0) { flash("⚠️ لازم تحط بيانات الشيك"); return; }

  let sale;
  if (state.editingSaleId) {
    const oldSale = scoped("sales").find((s) => s.id === state.editingSaleId);
    sale = { ...oldSale, customerId, items: [], quick: true, invoiceNo: state.saleForm.invoiceNo || "", photo: state.saleForm.photo || oldSale.photo || null, total, subtotal: total, tax: 0, discount: 0, paidNow: paidNum, payType: isCheck ? "credit" : payType, checkPayment: isCheck };
    persistScoped("sales", scoped("sales").map((s) => (s.id === state.editingSaleId ? sale : s)));
    flash("تم تحديث الفاتورة");
  } else {
    sale = { id: uid(), ts: new Date().toISOString(), customerId, items: [], quick: true, invoiceNo: state.saleForm.invoiceNo || "", photo: state.saleForm.photo || null, total, subtotal: total, tax: 0, discount: 0, paidNow: paidNum, payType: isCheck ? "credit" : payType, checkPayment: isCheck };
    const saved = addScoped("sales", sale);
    if (!saved) {
      flash("❌ فشل حفظ الفاتورة! مساحة التخزين ممتلئة — جرب تشيل الصورة أو امسح صور فواتير قديمة");
      return;
    }
    if (settings.autoPrintSale) {
      const partyName = customerId ? ((scoped("customers").find((c) => c.id === customerId) || {}).name || "") : "عميل نقدي";
      setTimeout(() => printInvoice({ ...sale, partyName }, "sale"), 300);
    }
    flash(isCheck ? "تم تسجيل الفاتورة والشيكات" : payType === "credit" ? "تم تسجيل فاتورة آجلة" : "تمت عملية البيع");
  }

  if (isCheck) {
    const party = scoped("customers").find((c) => c.id === customerId);
    (state._checkRows || []).filter((r) => (parseFloat(r.amount) || 0) > 0).forEach((r) => {
      addScoped("checks", {
        id: uid(), ts: new Date().toISOString(), dueDate: r.dueDate || "", amount: parseFloat(r.amount) || 0,
        checkNo: r.checkNo || "", bank: r.bank || "", photo: r.photo || null,
        desc: `شيك من: ${party ? party.name : ""}${r.checkNo ? " — رقم " + r.checkNo : ""}${r.bank ? " — " + r.bank : ""}`,
        status: "pending", saleId: sale.id,
      });
    });
    state._checkRows = [];
  }
  resetSaleForm();
}
function startEditSale(id) {
  const s = scoped("sales").find((x) => x.id === id);
  if (!s) return;
  state.editingSaleId = id;
  if (s.quick) {
    state.saleForm = { customerId: s.customerId || "", payType: s.payType, paidNow: String(s.paidNow), quickMode: true, invoiceNo: s.invoiceNo || "", quickTotal: String(s.total), photo: s.photo || null };
    state.cart = [];
  } else {
    state.saleForm = { customerId: s.customerId || "", payType: s.payType, paidNow: String(s.paidNow), quickMode: false, invoiceNo: "", quickTotal: "", photo: null };
    state.cart = s.items.map((it) => {
      const prod = scoped("products").find((p) => p.id === it.productId);
      return { productId: it.productId, name: it.name, price: it.price, qty: it.qty, stock: (prod ? prod.stock : 0) + it.qty };
    });
  }
  openSaleCartSheet();
}
function deleteSale(id) {
  const s = scoped("sales").find((x) => x.id === id);
  if (!s) return;
  const restore = {};
  s.items.forEach((it) => { restore[it.productId] = (restore[it.productId] || 0) + it.qty; });
  persistScoped("products", scoped("products").map((p) => (restore[p.id] ? { ...p, stock: p.stock + restore[p.id] } : p)));
  persistScoped("sales", scoped("sales").filter((x) => x.id !== id));
  if (state.editingSaleId === id) resetSaleForm(); else render();
  flash("تم إلغاء الفاتورة");
}

function completePurchase() {
  if (state.purchaseForm.quickMode) return completeQuickPurchase();
  const total = state.pcart.reduce((a, c) => a + c.cost * c.qty, 0);
  const paidNum = parseFloat(state.purchaseForm.paidNow) || 0;
  let supplierId = state.purchaseForm.supplierId || null;
  const payType = state.purchaseForm.payType;
  const canSubmit = state.pcart.length > 0 && (payType === "cash" ? paidNum >= total : supplierId);
  if (!canSubmit) return;

  // if a customer name was picked instead of an existing supplier, auto-create a linked supplier record
  if (supplierId && supplierId.startsWith("custlink:")) {
    const customerId = supplierId.slice("custlink:".length);
    const customer = scoped("customers").find((c) => c.id === customerId);
    const newSupplier = { id: uid(), name: customer ? customer.name : "عميل", phone: customer ? customer.phone : "", opening: 0, notes: "تم إنشاؤه تلقائيًا من حساب عميل بنفس الاسم" };
    addScoped("suppliers", newSupplier);
    supplierId = newSupplier.id;
    flash(`تم إنشاء حساب مورد جديد باسم ${newSupplier.name} تلقائيًا`);
  }

  const products = scoped("products");
  const destWarehouseId = state.editingPurchaseId ? null : (state.purchaseForm.destWarehouseId || null);
  if (state.editingPurchaseId) {
    const oldP = scoped("purchases").find((p) => p.id === state.editingPurchaseId);
    if (!oldP.destWarehouseId) {
      const delta = {};
      oldP.items.forEach((it) => { delta[it.productId] = (delta[it.productId] || 0) - it.qty; });
      state.pcart.forEach((c) => { delta[c.productId] = (delta[c.productId] || 0) + c.qty; });
      persistScoped("products", products.map((p) => (delta[p.id] ? { ...p, stock: p.stock + delta[p.id] } : p)));
    }
    const updated = { ...oldP, supplierId, items: state.pcart.map((c) => ({ productId: c.productId, name: c.name, cost: c.cost, qty: c.qty })), total, paidNow: paidNum, payType };
    persistScoped("purchases", scoped("purchases").map((p) => (p.id === state.editingPurchaseId ? updated : p)));
    flash("تم تحديث فاتورة الشراء");
  } else {
    if (destWarehouseId) {
      state.pcart.forEach((c) => {
        addScoped("warehouseEntries", { id: uid(), warehouseId: destWarehouseId, ts: new Date().toISOString(), type: "in", productName: c.name, qty: c.qty, unit: "", party: "", note: "شراء فاتورة" });
      });
    } else {
      persistScoped("products", products.map((p) => { const it = state.pcart.find((c) => c.productId === p.id); return it ? { ...p, stock: p.stock + it.qty, cost: it.cost || p.cost } : p; }));
    }
    const purchase = { id: uid(), ts: new Date().toISOString(), supplierId, items: state.pcart.map((c) => ({ productId: c.productId, name: c.name, cost: c.cost, qty: c.qty })), total, paidNow: paidNum, payType, destWarehouseId: destWarehouseId || undefined, repId: state._activeRepId || undefined };
    addScoped("purchases", purchase);
    flash("تم تسجيل فاتورة الشراء");
  }
  resetPurchaseForm();
}

    const customer = scoped("customers").find((c) => c.id === customerId);
    const newSupplier = { id: uid(), name: customer ? customer.name : "عميل", phone: customer ? customer.phone : "", opening: 0, notes: "تم إنشاؤه تلقائيًا من حساب عميل بنفس الاسم" };
    addScoped("suppliers", newSupplier);
    supplierId = newSupplier.id;

  } else {
    const purchase = { id: uid(), ts: new Date().toISOString(), supplierId, items: [], quick: true, invoiceNo: state.purchaseForm.invoiceNo || "", photo: state.purchaseForm.photo || null, total, paidNow: paidNum, payType, repId: state._activeRepId || undefined };

let scannerStream = null;
let pendingCapture = null; // { kind: 'product'|'newItem', vals }
function openScanModal(context) {

  };

}
function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function fillCheckAmount(selectEl) {
  const opt = selectEl.options[selectEl.selectedIndex];
  const amt = opt ? opt.getAttribute("data-amount") : "";
  const input = document.getElementById("v-amount");
  if (input && amt) input.value = amt;
}
function handleScanResult(context, code) {
  stopScanner();
  if (context === "field" && pendingCapture) {
    const cap = pendingCapture; pendingCapture = null;
    if (cap.kind === "product") {
      state.modal = { type: "product", product: {
        id: cap.vals.id, name: cap.vals.name, sku: cap.vals.sku, barcode: code, category: cap.vals.category,
        price: cap.vals.price, cost: cap.vals.cost, stock: cap.vals.stock, minStock: cap.vals.minStock,
      } };
    } else {
      state.modal = { type: "newItem", name: cap.vals.name, barcode: code };
    }
    render();
    return;
  }
  if (context === "sale" || context === "purchase") {
    state.modal = { type: context === "sale" ? "saleCart" : "purchaseCart" };
    const products = scoped("products");
    const found = products.find((p) => p.barcode && p.barcode === code);
    if (context === "sale") {
      if (found) { addToCart(found.id); flash("تمت إضافة: " + found.name); }
      else { state.query = code; flash("لم يتم العثور على منتج بهذا الباركود"); render(); }
    } else {
      if (found) { addToPCart(found.id); flash("تمت إضافة: " + found.name); }
      else { openNewItemModal("", code); }
    }
    return;
  }
  closeModal();
  const products = scoped("products");
  const found = products.find((p) => p.barcode && p.barcode === code);
}
async function startScanner(onDetect) {
  const video = document.getElementById("scanner-video");
  const errBox = document.getElementById("scanner-error");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    scannerStream = stream;
    if (!video) return;
    video.srcObject = stream;
    await video.play();
    if (!("BarcodeDetector" in window)) {
      if (errBox) errBox.textContent = "المتصفح الحالي لا يدعم قراءة الباركود تلقائيًا. اكتب الرمز يدويًا بالأسفل.";
      return;
    }
    const detector = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "code_93", "itf", "codabar", "qr_code"] });
    const tick = async () => {
      if (!state.modal || state.modal.type !== "scan") return;
      try {
        const codes = await detector.detect(video);
        if (codes && codes[0]) { onDetect(codes[0].rawValue); return; }
      } catch (e) {}
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } catch (e) {
    if (errBox) errBox.textContent = "تعذّر الوصول إلى الكاميرا (قد تكون غير متاحة هنا). اكتب رمز الباركود يدويًا بالأسفل.";
  }
}
function stopScanner() { if (scannerStream) { scannerStream.getTracks().forEach((t) => t.stop()); scannerStream = null; } }
function submitManualBarcode() {
  const val = document.getElementById("scanner-manual").value.trim();
  if (!val) return;
  if (state.modal && state.modal.onDetect) state.modal.onDetect(val);
}

function addVoucher(kind, partyId) {
  const desc = (document.getElementById("v-desc") || {}).value?.trim() || "";
  const list = kind === "customer" ? scoped("customers") : scoped("suppliers");
  const party = list.find((p) => p.id === partyId);

  if (kind === "customer") {
    // customer receipt: cash portion + zero or more checks, combined in one voucher
    const cashAmount = parseFloat((document.getElementById("v-cash") || {}).value) || 0;
    const rows = state._showChecksInVoucher ? (state._checkRows || []).filter((r) => (parseFloat(r.amount) || 0) > 0) : [];
    const checksTotal = rows.reduce((a, r) => a + (parseFloat(r.amount) || 0), 0);
    const amount = cashAmount + checksTotal;
    if (amount <= 0) { flash("أدخل مبلغ نقدي أو شيك واحد على الأقل"); return; }
    const method = rows.length > 0 && cashAmount > 0 ? "mixed" : rows.length > 0 ? "check" : "cash";
    const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc, method, cashAmount, checksCount: rows.length };
    rows.forEach((r) => {
      addScoped("checks", {
        id: uid(), ts: new Date().toISOString(), dueDate: r.dueDate || "", amount: parseFloat(r.amount) || 0,
        checkNo: r.checkNo || "", bank: r.bank || "", photo: r.photo || null,
        desc: `شيك من: ${party ? party.name : ""}${r.checkNo ? " — رقم " + r.checkNo : ""}${r.bank ? " — " + r.bank : ""}`,
        status: "pending", voucherId: v.id,
      });
    });
    addScoped("vouchers", v);
    flash(method === "mixed" ? "تم تسجيل السند (نقدي + شيك)" : rows.length > 0 ? `تم تسجيل ${rows.length} شيك وربطهم بذمة العميل` : "تم تسجيل تحصيل الدفعة");
    state._voucherCash = ""; state._showChecksInVoucher = false; state._checkRows = [];
    render();
    printVoucher(kind, v);
    return;
  }

  const isCheck = state._voucherMethod === "check";
  if (isCheck && kind === "supplier") {
    // endorsing one or more EXISTING checks to pay a supplier → deduct from checks pool, not cash
    const ids = state._selectedEndorseChecks || [];
    if (ids.length === 0) { flash("اختر شيك واحد على الأقل للتجيير"); return; }
    const label = `مجيّر لـ: ${party ? party.name : ""}${desc ? " — " + desc : ""}`;
    let total = 0;
    persistScoped("checks", scoped("checks").map((c) => {
      if (!ids.includes(c.id)) return c;
      total += c.amount;
      return { ...c, status: "endorsed", desc: label + (c.desc ? " (من: " + c.desc + ")" : "") };
    }));
    const amount = total;
    const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc, method: "check", checksCount: ids.length };
    addScoped("vouchers", v);
    flash(`تم تجيير ${ids.length} شيك للمورد`);
    state._voucherMethod = "cash"; state._selectedEndorseChecks = [];
    render();
    printVoucher(kind, v);
    return;
  }

  // plain cash voucher (supplier payment)
  const amount = parseFloat((document.getElementById("v-amount") || {}).value) || 0;
  if (amount <= 0) return;
  const v = { id: uid(), ts: new Date().toISOString(), partyKind: kind, partyId, partyName: party ? party.name : "", amount, desc, method: "cash" };
  addScoped("vouchers", v);
  flash(kind === "customer" ? "تم تسجيل تحصيل الدفعة" : "تم تسجيل الدفعة للمورد");
  render();
  printVoucher(kind, v);
}

/* ---- multi-check row builder (customer receipts) ---- */
function addCheckRow() { state._checkRows = state._checkRows || []; state._checkRows.push({ amount: "", checkNo: "", bank: "", dueDate: "", photo: null }); render(); }
function removeCheckRow(i) { state._checkRows.splice(i, 1); render(); }
function updateCheckRow(i, field, val) { state._checkRows[i][field] = val; }
function sumCheckRows() { return (state._checkRows || []).reduce((a, r) => a + (parseFloat(r.amount) || 0), 0); }
function readAndCompressImage(file, callback, maxW, quality) {
  maxW = maxW || 900;
  quality = quality || 0.6;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL("image/jpeg", quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function replacePhotoInRecord(key, oldDataUrl, newUrl) {
  const idx = (DB[key] || []).findIndex((x) => x.photo === oldDataUrl);
  if (idx === -1) return;
  DB[key][idx] = { ...DB[key][idx], photo: newUrl };
  const ok = persist(key);
  if (ok) protectRecentlyAdded(key, DB[key][idx]);
  render();
}

    state._checkRows[i].photo = dataUrl;

      if (state._checkRows[i] && state._checkRows[i].photo === dataUrl) { state._checkRows[i].photo = finalUrl; render(); }

function getOrCreateBarcode(product) {
  if (product.barcode && product.barcode.trim()) return product.barcode.trim();
  let code = "";
  do { code = "2" + String(Math.floor(Math.random() * 100000000000)).padStart(11, "0"); }
  while (scoped("products").some((p) => p.barcode === code));
  persistScoped("products", scoped("products").map((p) => (p.id === product.id ? { ...p, barcode: code } : p)));
  return code;
}
function printBarcodeLabels() {
  const settings = currentSettings();
  const products = scoped("products");
  const items = [];
  Object.entries(state._barcodeQty || {}).forEach(([pid, qtyStr]) => {
    const qty = parseInt(qtyStr) || 0;
    const product = products.find((p) => p.id === pid);
    if (product && qty > 0) {
      const code = getOrCreateBarcode(product);
      for (let i = 0; i < qty; i++) items.push({ name: product.name, price: product.price, code });
    }
  });
  if (items.length === 0) { flash("حط كمية للأصناف اللي عايز تطبعها"); return; }
  const labelsHtml = items.map((it, i) => `
    <div style="width:31%;display:inline-block;border:1px dashed #999;border-radius:6px;padding:8px 4px;margin:4px 1%;text-align:center;page-break-inside:avoid;break-inside:avoid;vertical-align:top;">

    <div>${labelsHtml}</div>`;
  showPrint(html);
  setTimeout(() => {
    document.querySelectorAll(".barcode-svg").forEach((el) => {
      try { window.JsBarcode(el, el.dataset.value, { format: "CODE128", displayValue: true, fontSize: 11, height: 34, margin: 2 }); } catch (e) { console.error("barcode render failed", e); }
    });

}

function saveProductFromForm() {
  const id = state.modal.product ? state.modal.product.id : null;
  const existingPhoto = state.modal.product ? state.modal.product.photo || "" : "";
  const photo = state._prPhotoRemoved ? "" : (state._prPhoto || existingPhoto);
  const form = {
    id: id || uid(),
    name: document.getElementById("pr-name").value.trim(),
    sku: document.getElementById("pr-sku").value.trim(),
    barcode: document.getElementById("pr-barcode").value.trim(),
    category: document.getElementById("pr-category").value.trim(),
    price: parseFloat(document.getElementById("pr-price").value) || 0,
    cost: parseFloat(document.getElementById("pr-cost").value) || 0,
    stock: parseInt(document.getElementById("pr-stock").value) || 0,
    minStock: parseInt(document.getElementById("pr-minstock").value) || 5,
    photo: photo || null,
  };
  if (!form.name) return;
  const list = scoped("products");

  if (!id) {
    const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, " ");
    const newNorm = norm(form.name);
    const exact = list.find((p) => norm(p.name) === newNorm);
    if (exact) { flash(`⚠️ في صنف بنفس الاسم بالظبط ("${exact.name}") — عدّله بدل ما تضيفه تاني`); return; }

    if (!state._confirmDuplicateProduct) {
      const similar = list.find((p) => { const pn = norm(p.name); return pn !== newNorm && (pn.includes(newNorm) || newNorm.includes(pn)); });
      if (similar) {
        state._confirmDuplicateProduct = true;
        flash(`⚠️ في صنف قريب بالاسم ("${similar.name}") — لو متأكد إنه مختلف فعلاً، دوس "حفظ" تاني للتأكيد`);
        return;
      }
    }
  }
  state._confirmDuplicateProduct = false;

  if (id) persistScoped("products", list.map((p) => (p.id === id ? form : p)));
  else persistScoped("products", [...list, form]);
  closeModal();
}

/* ===================== REPORTS ===================== */
function renderReports() {
  const settings = currentSettings();
  const products = scoped("products"), suppliers = scoped("suppliers"), customers = scoped("customers");
  const allSales = scoped("sales"), allPurchases = scoped("purchases"), allExpenses = scoped("expenses");
  const range = state.reportRange;
  const inRange = (ts) => {
    const d = new Date(ts), now = new Date();
    if (range === "today") return todayStr(ts) === todayStr(now);
    if (range === "7d") return now - d <= 7 * 86400000;
    if (range === "30d") return now - d <= 30 * 86400000;
    return true;
  };
  const fSales = allSales.filter((s) => inRange(s.ts));
  const fPurchases = allPurchases.filter((p) => inRange(p.ts));
  const fExpenses = allExpenses.filter((e) => inRange(e.ts));
  const revenue = fSales.reduce((a, s) => a + s.total, 0);
  const collected = fSales.reduce((a, s) => a + s.paidNow, 0);
  const purchaseTotal = fPurchases.reduce((a, p) => a + p.total, 0);
  const expenseTotal = fExpenses.reduce((a, e) => a + e.amount, 0);
  const costMap = Object.fromEntries(products.map((p) => [p.id, p.cost || 0]));
  const grossProfit = fSales.reduce((a, s) => a + s.items.reduce((b, it) => b + (it.price - (costMap[it.productId] || 0)) * it.qty, 0), 0);
  const topMap = {};
  fSales.forEach((s) => s.items.forEach((it) => { if (!topMap[it.name]) topMap[it.name] = { name: it.name, qty: 0, revenue: 0 }; topMap[it.name].qty += it.qty; topMap[it.name].revenue += it.price * it.qty; }));
  const topProducts = Object.values(topMap).sort((a, b) => b.qty - a.qty).slice(0, 5);
  const lowStock = products.filter((p) => p.stock <= (p.minStock ?? 5));
  const owedByCustomers = customers.map((c) => ({ ...c, bal: customerBalance(c) })).filter((c) => c.bal > 0);
  const owedToSuppliers = suppliers.map((s) => ({ ...s, bal: supplierBalance(s) })).filter((s) => s.bal > 0);

  const ranges = [["today", "اليوم"], ["7d", "٧ أيام"], ["30d", "٣٠ يوم"], ["all", "الكل"]];
  let html = `<div class="row-flex" style="justify-content:space-between;">
    <div class="tabbar" style="flex:1;">${ranges.map(([id, label]) => `<button class="tab-pill ${range === id ? "active" : ""}" onclick="state.reportRange='${id}';render();">${label}</button>`).join("")}</div>
    <button class="btn btn-ghost" style="background:var(--greenLight);color:var(--green);white-space:nowrap;" onclick="printTodayReport()">🖨 كشف اليوم</button>
  </div>`;

  html += `<div class="card" style="padding:12px;margin-top:12px;margin-bottom:14px;">
    <div class="row-title" style="margin-bottom:8px;">📆 كشف حساب لفترة (يوم واحد، شهر، أو أي مدة)</div>
    <div class="grid2" style="margin-bottom:8px;">
      <label class="field" style="margin-bottom:0;"><span class="lbl">من تاريخ</span><input id="report-range-from" type="date" class="mono" value="${state._reportRangeFrom || ""}" oninput="state._reportRangeFrom=this.value;" /></label>
      <label class="field" style="margin-bottom:0;"><span class="lbl">إلى تاريخ</span><input id="report-range-to" type="date" class="mono" value="${state._reportRangeTo || todayStr(Date.now())}" oninput="state._reportRangeTo=this.value;" /></label>
    </div>
    <button class="btn btn-ghost btn-block" style="background:var(--greenLight);color:var(--green);margin-bottom:8px;" onclick="setLastMonthRange()">⏪ آخر شهر بضغطة واحدة</button>
    <button class="btn btn-green btn-block" onclick="printRangeReport(document.getElementById('report-range-from').value, document.getElementById('report-range-to').value)">🖨 اطبع كشف الفترة</button>
  </div>`;

  html += `<div class="section-title">المبيعات</div><div class="stat-row">
    <div class="stat-card"><div class="stat-label"><span>الإيرادات</span></div><div class="stat-value">${fmt(revenue)} ${esc(settings.currency)}</div></div>
    <div class="stat-card"><div class="stat-label"><span>المحصّل نقدًا</span></div><div class="stat-value">${fmt(collected)} ${esc(settings.currency)}</div></div>
    <div class="stat-card"><div class="stat-label"><span>عدد الفواتير</span></div><div class="stat-value">${fSales.length}</div></div>
  </div>
  <div class="stat-row" style="grid-template-columns:1fr;"><div class="stat-card"><div class="stat-label"><span>الربح التقديري</span></div><div class="stat-value">${fmt(grossProfit)} ${esc(settings.currency)}</div></div></div>`;

  html += `<div class="section-title">المشتريات والمصروفات</div><div class="stat-row" style="grid-template-columns:1fr 1fr;">
    <div class="stat-card"><div class="stat-label"><span>إجمالي المشتريات</span></div><div class="stat-value">${fmt(purchaseTotal)} ${esc(settings.currency)}</div></div>
    <div class="stat-card"><div class="stat-label"><span>إجمالي المصروفات</span></div><div class="stat-value">${fmt(expenseTotal)} ${esc(settings.currency)}</div></div>
  </div>`;

  if (owedByCustomers.length || owedToSuppliers.length) {
    html += `<div class="flex-between" style="margin-top:8px;"><div class="section-title" style="margin:0;">الذمم</div>
      <button class="btn btn-ghost" style="background:var(--greenLight);color:var(--green);font-size:11px;padding:5px 10px;" onclick="printDebtsStatement()">🖨 كشف الذمم بالأسماء</button>
    </div><div class="stat-row" style="grid-template-columns:1fr 1fr;">
      <div class="stat-card"><div class="stat-label"><span>مستحق لنا (عملاء)</span></div><div class="stat-value">${fmt(owedByCustomers.reduce((a, c) => a + c.bal, 0))} ${esc(settings.currency)}</div></div>
      <div class="stat-card"><div class="stat-label"><span>مستحق علينا (موردون)</span></div><div class="stat-value">${fmt(owedToSuppliers.reduce((a, s) => a + s.bal, 0))} ${esc(settings.currency)}</div></div>
    </div>`;
  }

  if (lowStock.length) {
    html += `<div class="card" style="padding:12px;background:var(--stampLight);border-color:transparent;margin-bottom:14px;">
      <div style="color:var(--stamp);font-weight:700;font-size:13px;margin-bottom:6px;">⚠️ تنبيه نفاد المخزون (${lowStock.length})</div>
      ${lowStock.map((p) => `<div class="flex-between" style="font-size:12px;"><span>${esc(p.name)}</span><span class="mono">متبقي ${p.stock}</span></div>`).join("")}
    </div>`;
  }

  html += `<div class="section-title">الأكثر مبيعًا</div>`;
  if (topProducts.length === 0) html += emptyState("لا توجد مبيعات في هذه الفترة", true);
  else {
    html += `<div class="card">` + topProducts.map((t, i) => `<div class="list-row"><span class="mono row-sub">${i + 1}</span>
      <span class="flex1 truncate" style="font-size:13px;">${esc(t.name)}</span>
      <span class="mono row-sub">× ${t.qty}</span>
      <span class="mono" style="font-weight:600;">${fmt(t.revenue)} ${esc(settings.currency)}</span></div>`).join("") + `</div>`;
  }
  return html;
}

function addTransferCartItem() {
  const productId = document.getElementById("we-product-select").value;
  const product = scoped("products").find((p) => p.id === productId);
  const qty = parseFloat(document.getElementById("we-qty").value) || 0;
  if (!product || qty <= 0) { flash("اختار صنف وحط كمية أول"); return; }
  if (!state._transferCart) state._transferCart = [];
  const existing = state._transferCart.find((c) => c.productId === productId);
  if (existing) existing.qty += qty;
  else state._transferCart.push({ productId, name: product.name, qty });
  render();
}
function removeTransferCartItem(index) {
  state._transferCart.splice(index, 1);
  render();
}
function confirmTransfer(warehouseId) {
  const mode = state._whEntryType;
  const isIn = mode === "transfer_in";
  const cart = state._transferCart && state._transferCart.length > 0 ? state._transferCart : (() => {
    const productId = document.getElementById("we-product-select").value;
    const product = scoped("products").find((p) => p.id === productId);
    const qty = parseFloat(document.getElementById("we-qty").value) || 0;
    return product && qty > 0 ? [{ productId, name: product.name, qty }] : [];
  })();
  if (cart.length === 0) { flash("أضف صنف واحد على الأقل"); return; }

  if (isIn) {
    for (const item of cart) {
      const product = scoped("products").find((p) => p.id === item.productId);
      if (!product || item.qty > product.stock) { flash(`ما ينفعش — المتوفر بالمحل بس ${product ? fmt(product.stock) : 0} من "${item.name}"`); return; }
    }
  } else {
    for (const item of cart) {
      const existing = scoped("warehouseEntries").filter((e) => e.warehouseId === warehouseId && e.productName === item.name);
      const available = existing.reduce((a, e) => a + (e.type === "in" ? e.qty : -e.qty), 0);
      if (item.qty > available) { flash(`ما ينفعش — المتوفر بالمستودع بس ${fmt(available)} من "${item.name}"`); return; }
    }
  }

  cart.forEach((item) => {
    if (isIn) {
      persistScoped("products", scoped("products").map((p) => (p.id === item.productId ? { ...p, stock: p.stock - item.qty } : p)));
      addScoped("warehouseEntries", { id: uid(), warehouseId, ts: new Date().toISOString(), type: "in", productName: item.name, qty: item.qty, unit: "", party: "", note: "منقول من المحل" });
    } else {
      persistScoped("products", scoped("products").map((p) => (p.id === item.productId ? { ...p, stock: p.stock + item.qty } : p)));
      addScoped("warehouseEntries", { id: uid(), warehouseId, ts: new Date().toISOString(), type: "out", productName: item.name, qty: item.qty, unit: "", party: "", note: "منقول للمحل" });
    }
  });
  flash(`تم نقل ${cart.length} صنف ${isIn ? "للمستودع" : "للمحل"}`);
  state._transferCart = [];
  render();
}
function saveWarehouseEntry(warehouseId) {
  const mode = state._whEntryType || "in";
  const type = mode === "out" ? "out" : "in";
  const productName = document.getElementById("we-product").value.trim();
  const qty = parseFloat(document.getElementById("we-qty").value) || 0;
  const unit = document.getElementById("we-unit").value.trim();
  const party = document.getElementById("we-party").value.trim();
  const note = document.getElementById("we-note").value.trim();
  if (!productName || qty <= 0) return;
  if (type === "out") {
    const existing = scoped("warehouseEntries").filter((e) => e.warehouseId === warehouseId && e.productName === productName);
    const available = existing.reduce((a, e) => a + (e.type === "in" ? e.qty : -e.qty), 0);
    if (qty > available) { flash(`ما ينفعش — المتوفر بس ${fmt(available)} من "${productName}"`); return; }
  }
  addScoped("warehouseEntries", { id: uid(), warehouseId, ts: new Date().toISOString(), type, productName, qty, unit, party, note });
  flash(type === "in" ? "تم تسجيل سند إدخال" : "تم تسجيل سند إخراج وخصمه من المتوفر");
  state._whProductQuery = "";
  render();
}

function repPermissions(rep) {
  return { sale: true, collect: true, purchase: false, ...(rep.permissions || {}) };
}
function toggleRepPermission(repId, permKey) {
  const reps = loadKey("reps", []) || [];
  const idx = reps.findIndex((r) => r.id === repId);

function printPartyStatement(kind, partyId) {
  const settings = currentSettings();
  const isCustomer = kind === "customer";
  const list = scoped(isCustomer ? "customers" : "suppliers");
  const party = list.find((p) => p.id === partyId);
  const otherList = scoped(isCustomer ? "suppliers" : "customers");
  const otherParty = otherList.find((p) => p.name === party.name);

  const custParty = isCustomer ? party : otherParty;
  const supParty = isCustomer ? otherParty : party;

  const rows = [];
  if (custParty) {
    scoped("sales").filter((s) => s.customerId === custParty.id).forEach((t) => rows.push({
      ts: t.ts, amount: t.total,
      label: `بيع #${shortId(t.id)}: ` + t.items.map((it) => `${esc(it.name)} ${fmt(it.qty)}×${fmt(it.price)}`).join("، "),
    }));
    scoped("vouchers").filter((v) => v.partyKind === "customer" && v.partyId === custParty.id).forEach((v) => rows.push({
      ts: v.ts, amount: -v.amount, label: (v.desc || "تحصيل") + (v.method === "check" ? " (شيك)" : ""),
    }));
  }
  if (supParty) {
    scoped("purchases").filter((p) => p.supplierId === supParty.id).forEach((t) => rows.push({
      ts: t.ts, amount: -t.total,
      label: `شراء #${shortId(t.id)}: ` + t.items.map((it) => `${esc(it.name)} ${fmt(it.qty)}×${fmt(it.cost)}`).join("، "),
    }));
    scoped("vouchers").filter((v) => v.partyKind === "supplier" && v.partyId === supParty.id).forEach((v) => rows.push({
      ts: v.ts, amount: v.amount, label: (v.desc || "دفع") + (v.method === "check" ? " (شيك)" : ""),
    }));
  }
  rows.sort((a, b) => new Date(a.ts) - new Date(b.ts));

  const openingNet = (custParty ? custParty.opening || 0 : 0) - (supParty ? supParty.opening || 0 : 0);
  let running = openingNet;
  const rowsHtml = rows.map((r) => {

function printDebtsStatement() {

function setLastMonthRange() {
  const now = new Date();
  const firstOfThisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const lastOfPrevMonth = new Date(firstOfThisMonth.getTime() - 86400000);
  const firstOfPrevMonth = new Date(lastOfPrevMonth.getFullYear(), lastOfPrevMonth.getMonth(), 1);
  const toISO = (d) => d.toISOString().slice(0, 10);
  state._reportRangeFrom = toISO(firstOfPrevMonth);
  state._reportRangeTo = toISO(lastOfPrevMonth);
  render();
}
function printRangeReport(fromStr, toStr) {
  if (!fromStr || !toStr) { flash("اختار تاريخ البداية والنهاية الأول"); return; }
  const settings = currentSettings();
  const fromDate = new Date(fromStr + "T00:00:00");
  const toDate = new Date(toStr + "T23:59:59");
  const customers = scoped("customers"), suppliers = scoped("suppliers");
  const inRange = (ts) => { const d = new Date(ts); return d >= fromDate && d <= toDate; };
  const sales = scoped("sales").filter((s) => inRange(s.ts)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const purchases = scoped("purchases").filter((p) => inRange(p.ts)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const expenses = scoped("expenses").filter((e) => inRange(e.ts)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const vouchers = scoped("vouchers").filter((v) => inRange(v.ts)).sort((a, b) => new Date(a.ts) - new Date(b.ts));
  const totalSales = sales.reduce((a, s) => a + s.total, 0);
  const totalPurchases = purchases.reduce((a, p) => a + p.total, 0);
  const totalExpenses = expenses.reduce((a, e) => a + e.amount, 0);
  const vIn = vouchers.filter((v) => v.partyKind === "customer").reduce((a, v) => a + v.amount, 0);
  const vOut = vouchers.filter((v) => v.partyKind === "supplier").reduce((a, v) => a + v.amount, 0);
  const section = (title, items, rowFn, totalLabel, totalVal) => `<div style="margin-bottom:10px;"><div style="font-weight:700;font-size:12px;border-bottom:1px solid #ccc;padding-bottom:2px;margin-bottom:4px;">${title}</div>
    ${items.map(rowFn).join("") || `<div style="font-size:11px;color:#888;">لا توجد حركات</div>`}
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:11px;border-top:1px dotted #ccc;padding-top:2px;"><span>${totalLabel}</span><span>${totalVal}</span></div></div>`;
  const invoiceRow = (t, isSale) => {
    const party = isSale
      ? (t.customerId ? (customers.find((c) => c.id === t.customerId) || {}).name : "عميل نقدي")
      : (suppliers.find((s) => s.id === t.supplierId) || {}).name;
    const itemsLine = t.items.map((it) => `${esc(it.name)} ${fmt(it.qty)}×${fmt(isSale ? it.price : it.cost)}`).join("، ");
    return `<div style="padding:4px 0;border-bottom:1px dotted #ddd;page-break-inside:avoid;break-inside:avoid;">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;">
        <span>${fmtDate(t.ts)} · ${t.isReturn ? "🔄 مرتجع" : "فاتورة"} #${shortId(t.id)} — ${esc(party || "—")}</span>
        <span>${fmt(t.total)}</span>
      </div>
      <div style="font-size:10px;color:#555;">${itemsLine}</div>
    </div>`;
  };
  const html = `${printHead(settings)}
    <div style="text-align:center;font-weight:700;font-size:13px;margin-bottom:4px;">كشف حركة الفترة</div>
    <div style="text-align:center;font-size:11px;color:#666;margin-bottom:12px;">من ${fmtDate(fromDate.toISOString())} إلى ${fmtDate(toDate.toISOString())}</div>
    ${section(`المبيعات (${sales.length})`, sales, (s) => invoiceRow(s, true), "إجمالي المبيعات", fmt(totalSales) + " " + esc(settings.currency))}
    ${section(`المشتريات (${purchases.length})`, purchases, (p) => invoiceRow(p, false), "إجمالي المشتريات", fmt(totalPurchases) + " " + esc(settings.currency))}
    ${section(`المصروفات (${expenses.length})`, expenses, (e) => `<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;page-break-inside:avoid;break-inside:avoid;"><span>${fmtDate(e.ts)} · ${esc(e.account)}${e.desc ? " — " + esc(e.desc) : ""}</span><span>${fmt(e.amount)}</span></div>`, "إجمالي المصروفات", fmt(totalExpenses) + " " + esc(settings.currency))}
    ${section(`السندات (${vouchers.length})`, vouchers, (v) => `<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;page-break-inside:avoid;break-inside:avoid;"><span>${fmtDate(v.ts)} · ${v.partyKind === "customer" ? "تحصيل من" : "دفع لـ"} ${esc(v.partyName)}${v.desc ? " — " + esc(v.desc) : ""}${v.method === "check" ? " (شيك)" : v.method === "mixed" ? " (نقدي+شيك)" : ""}</span><span>${fmt(v.amount)}</span></div>`, "صافي السندات", fmt(vIn - vOut) + " " + esc(settings.currency))}

  showPrint(html);

function estimateStorageUsage() {
  let totalBytes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX)) totalBytes += (localStorage.getItem(k) || "").length;
    }
  } catch (e) {}
  return totalBytes;
}

  return `<div class="modal-title-row"><h3>الإعدادات</h3><button class="close-x" onclick="closeModal()">✕</button></div>

function returnItemModalHtml(txKind, txId, itemIndex) {

  return `<div class="modal-title-row"><h3>🔄 إرجاع صنف</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="row-sub" style="margin-bottom:4px;">${esc(it.name)}</div>

    <div class="row-sub" style="margin-bottom:10px;">سعر الوحدة: ${fmt(unitPrice)}</div>

function submitReturn(txKind, txId, itemIndex) {
  const isSale = txKind === "sale";
  const key = isSale ? "sales" : "purchases";
  const tx = scoped(key).find((t) => t.id === txId);
  if (!tx) return;
  const it = tx.items[itemIndex];
  let qty = parseFloat(document.getElementById("ret-qty").value) || 0;
  qty = Math.min(qty, it.qty);
  if (qty <= 0) return;
  const unitPrice = isSale ? it.price : it.cost;
  const returnTotal = qty * unitPrice;

  // رجّع الكمية للمخزون (بيع مرتجع = زيادة، شراء مرتجع = نقصان)
  const products = scoped("products");
  persistScoped("products", products.map((p) => (p.id === it.productId ? { ...p, stock: p.stock + (isSale ? qty : -qty) } : p)));

  const returnTx = isSale
    ? { id: uid(), ts: new Date().toISOString(), customerId: tx.customerId, items: [{ productId: it.productId, name: it.name, price: unitPrice, qty: -qty }], subtotal: -returnTotal, tax: 0, total: -returnTotal, paidNow: 0, payType: "credit", isReturn: true, originalId: tx.id }
    : { id: uid(), ts: new Date().toISOString(), supplierId: tx.supplierId, items: [{ productId: it.productId, name: it.name, cost: unitPrice, qty: -qty }], total: -returnTotal, paidNow: 0, payType: "credit", isReturn: true, originalId: tx.id };
  addScoped(key, returnTx);
  flash("تم تسجيل المرتجع");
  closeModal();
}

function productHistory(productId) {
  const customers = scoped("customers"), suppliers = scoped("suppliers");
  const rows = [];
  scoped("sales").forEach((s) => {
    const it = s.items.find((x) => x.productId === productId);
    if (it) {
      const cust = s.customerId ? (customers.find((c) => c.id === s.customerId) || {}).name : "نقدي";
      rows.push({ ts: s.ts, type: "sale", qty: it.qty, price: it.price, party: cust });
    }
  });
  scoped("purchases").forEach((p) => {
    const it = p.items.find((x) => x.productId === productId);
    if (it) {
      const sup = (suppliers.find((s) => s.id === p.supplierId) || {}).name || "";
      rows.push({ ts: p.ts, type: "purchase", qty: it.qty, price: it.cost, party: sup });
    }
  });
  return rows.sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

function printBarcodeLabels(productIds, qtyEach) {
  const settings = currentSettings();
  const products = scoped("products").filter((p) => productIds.includes(p.id));
  if (products.length === 0) { flash("مفيش صنف محدد"); return; }
  let labelsHtml = "";
  let idx = 0;
  const specs = [];
  products.forEach((p) => {
    const codeVal = String(p.barcode || p.sku || p.id).replace(/[^A-Za-z0-9\-]/g, "");
    for (let i = 0; i < qtyEach; i++) {
      const elId = `bc-label-${idx}`;
      specs.push({ elId, value: codeVal });
      labelsHtml += `<div style="display:inline-block;width:31%;margin:1%;text-align:center;border:1px dashed #ccc;padding:6px 2px;vertical-align:top;page-break-inside:avoid;break-inside:avoid;">
        <div style="font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(p.name)}</div>
        <svg id="${elId}"></svg>
        <div style="font-size:10px;">${fmt(p.price)} ${esc(settings.currency)}</div>
      </div>`;
      idx++;
    }
  });
  showPrint(`<div style="text-align:center;">${labelsHtml}</div>`);
  setTimeout(() => {
    specs.forEach((s) => {
      try {
        window.JsBarcode("#" + s.elId, s.value, { format: "CODE128", width: 1.4, height: 34, fontSize: 10, margin: 2 });
      } catch (e) { console.error("barcode render failed", s.value, e); }
    });
  }, 30);
  closeModal();
}
function printProductStatement(productId) {
  const settings = currentSettings();
  const product = scoped("products").find((p) => p.id === productId);
  if (!product) return;
  const history = productHistory(productId);
  const totalIn = history.filter((h) => h.type === "purchase").reduce((a, h) => a + h.qty, 0);
  const totalOut = history.filter((h) => h.type === "sale").reduce((a, h) => a + h.qty, 0);
  const rows = [...history].reverse().map((h) => `<tr style="border-bottom:1px dotted #ccc;">
    <td style="text-align:right;padding:3px 0;">${fmtDate(h.ts)}</td>
    <td style="text-align:right;">${h.type === "sale" ? "بيع" : "شراء"}</td>

    <td style="text-align:center;">${h.type === "sale" ? "-" : "+"}${fmt(h.qty)}</td>
    <td style="text-align:center;">${fmt(h.price)}</td>
  </tr>`).join("");
  const html = `${printHead(settings)}
    <div style="text-align:center;font-weight:700;font-size:13px;margin-bottom:10px;">كشف حركة صنف: ${esc(product.name)}</div>

      <thead><tr style="border-bottom:1px solid #999;"><th style="text-align:right;">التاريخ</th><th style="text-align:right;">النوع</th><th style="text-align:right;">الجهة</th><th>الكمية</th><th>السعر</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:10px;padding-top:8px;border-top:1px dashed #999;">
      <span>إجمالي الوارد: ${fmt(totalIn)}</span><span>إجمالي الصادر: ${fmt(totalOut)}</span>
    </div>`;
  showPrint(html);
}
