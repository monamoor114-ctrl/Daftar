<style>
  :root {
    --paper:#EDE7D8; --paperLight:#F8F4E9; --card:#FFFFFF;
    --ink:#232A22; --inkSoft:#5B6357;
    --green:#2F5233; --greenDark:#233F27; --greenLight:#E4EAE1;
    --stamp:#B23A2E; --stampLight:#F6E1DE;
    --gold:#A9782F; --goldLight:#F3E7CF;
    --line:#D6CDB2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: -apple-system, Roboto, "Segoe UI", sans-serif; overscroll-behavior-y: contain; }
  .mono { font-family: "Courier New", monospace; }
  input.mono { direction: ltr; text-align: left; unicode-bidi: plaintext; }
  .display { font-weight:700; }
  header.app-header { background:var(--greenDark); color:#fff; position:sticky; top:0; z-index:40; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .header-inner { max-width:720px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .header-left { display:flex; align-items:center; gap:8px; min-width:0; }
  .icon-btn { background:transparent; border:none; color:#fff; cursor:pointer; padding:8px; border-radius:8px; }
  .icon-btn:active { background:rgba(255,255,255,.15); }
  .badge-btn { width:36px; height:36px; border-radius:8px; background:var(--gold); border:none; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; }
  main.app-main { max-width:720px; margin:0 auto; padding:14px 12px 40px; }
  h1,h2,h3,h4 { margin:0; }
  .title { font-size:18px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subtle-link { background:none; border:none; color:#C9D6C6; font-size:11px; padding:0; cursor:pointer; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px 10px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .tile .circle { width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .tile-label { font-weight:700; font-size:13.5px; }
  .stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .stat-label { font-size:10.5px; color:var(--inkSoft); display:flex; justify-content:space-between; }
  .stat-value { font-weight:700; font-size:14px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .list-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--line); }
  .list-row:first-child { border-top:none; }
  .flex1 { flex:1; min-width:0; }
  .truncate { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-title { font-weight:600; font-size:14px; }
  .row-sub { font-size:11px; color:var(--inkSoft); }
  input, select, textarea { font-family:inherit; font-size:14px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  label.field { display:block; margin-bottom:10px; }
  label.field .lbl { display:block; font-size:11.5px; color:var(--inkSoft); margin-bottom:4px; }
  .btn { border:none; border-radius:8px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-green { background:var(--green); color:#fff; }
  .btn-stamp { background:var(--stampLight); color:var(--stamp); }
  .btn-gold { background:var(--goldLight); color:var(--gold); }
  .btn-ghost { background:var(--paperLight); border:1px solid var(--line); color:var(--inkSoft); }
  .btn-block { width:100%; display:block; text-align:center; }
  .btn-disabled { background:var(--line); color:var(--inkSoft); }
  .row-flex { display:flex; gap:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .search-wrap { position:relative; }
  .search-wrap input { padding-right:34px; }
  .search-icon { position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--inkSoft); }
  .product-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  @media(min-width:520px){ .product-grid{ grid-template-columns:1fr 1fr 1fr; } }
  .product-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:right; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .product-card:disabled, .product-card.disabled { opacity:.5; }
  .chip { display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; }
  .cart-card { background:var(--paperLight); border:1px solid var(--line); border-radius:10px; margin-top:14px; }
  .cart-head { padding:14px; text-align:center; border-bottom:1px dashed var(--line); position:relative; }
  .cart-items { padding:10px 14px; max-height:220px; overflow-y:auto; }
  .cart-item { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .qty-btn { width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  .cart-totals { padding:10px 14px; border-top:1px dashed var(--line); }
  .cart-foot { padding:10px 14px 14px; }
  .flex-between { display:flex; justify-content:space-between; align-items:center; }
  .empty { text-align:center; padding:40px 10px; color:var(--inkSoft); }
  .empty.small { padding:20px 10px; }
  .empty .emoji { font-size:30px; margin-bottom:8px; }
  .section-title { font-size:14px; font-weight:700; margin:16px 0 8px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; } }
  .modal-box { background:var(--paperLight); color:var(--ink); width:100%; max-width:440px; max-height:88vh; overflow-y:auto; overscroll-behavior-y: contain; border-radius:16px 16px 0 0; padding:20px; }
  @media(min-width:640px){ .modal-box{ border-radius:16px; } }
  .modal-title-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .close-x { background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink); }
  .tabbar { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .tab-pill { padding:6px 14px; border-radius:999px; font-size:12px; white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--inkSoft); cursor:pointer; }
  .tab-pill.active { background:var(--green); color:#fff; border-color:var(--green); }
  .toggle { width:40px; height:22px; border-radius:999px; border:none; position:relative; cursor:pointer; }
  .toggle .knob { position:absolute; top:2px; width:16px; height:16px; border-radius:999px; background:#fff; transition:right .15s; }
  .flash { position:fixed; top:12px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  .floating-bar { position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--greenDark); color:#fff; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:space-between; box-shadow:0 -4px 12px rgba(0,0,0,.2); cursor:pointer; }
  .floating-bar .fb-info { display:flex; flex-direction:column; }
  .floating-bar .fb-count { font-size:11px; color:#C9D6C6; }
  .floating-bar .fb-total { font-size:16px; font-weight:700; font-family:"Courier New",monospace; }
  .floating-bar .fb-btn { background:var(--gold); color:var(--greenDark); border:none; border-radius:8px; padding:9px 18px; font-weight:700; font-size:13.5px; }
  .scroll-pad-bottom { padding-bottom:76px; }
  @media print {
    @page { size: 58mm auto; margin: 2mm; }
    body > *:not(#print-root) { display:none !important; }
    #print-root { position:static !important; visibility:visible; width:100%; padding:16px; background:#fff; color:#111; }
    #print-root * { visibility:visible; }
    .no-print { display:none !important; }
    .print-area tr, .print-area .print-row, .print-area .print-card { page-break-inside:avoid; break-inside:avoid; }
    .print-area table { page-break-inside:auto; }
    .print-area thead { display:table-header-group; }
    html, body { height:auto !important; overflow:visible !important; }
  }
</style>

<body>
<div id="app"></div>
<div id="flash-holder"></div>

<script>
/* ===================== STORAGE ===================== */
const LS_PREFIX = "daftar_";
function loadKey(key, fallback) {
  try { const raw = localStorage.getItem(LS_PREFIX + key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
function saveKey(key, value) {
  try {
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error("saveKey failed", key, e);
    cloudSyncBlocked = true;
    clearTimeout(cloudSyncTimer);
    flash("⚠️ فشل الحفظ! مساحة تخزين تليفونك ممتلئة تقريبًا — امسح صور فواتير قديمة مش محتاجها عشان تفضى مكان");
    return false;
  }
  cloudSyncBlocked = false;
  localLastModifiedAt = Date.now();
  cloudScheduleSync();
  return true;
}

/* ===================== CLOUD SYNC (Firebase) ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDrQ2rx7FM5cjoLqAAif7BJiFIHEL8hh2c",
  authDomain: "daftar-app-e0c7e.firebaseapp.com",
  projectId: "daftar-app-e0c7e",
  storageBucket: "daftar-app-e0c7e.firebasestorage.app",
  messagingSenderId: "727145520285",
  appId: "1:727145520285:web:29ff2ba1cacb33877cc874",
};
let cloudDb = null;
let cloudUnsub = null;
let cloudSyncTimer = null;
let cloudApplyingRemote = false; // يمنع حلقة تكرار: كتابة محلية → سحابة → رجوع محلي
let cloudSyncBlocked = false; // يمنع رفع نسخة ناقصة للسحابة لما يفشل حفظ محلي (تخزين ممتلئ)
let localLastModifiedAt = 0; // آخر وقت حصل فيه تعديل محلي (يحمي من إن نسخة سحابة قديمة تمسح تعديل حديث)
let cloudPushInFlight = false; // صحيح أثناء إرسال آخر نسخة للسحابة (لحد ما يتأكد نجح الإرسال)

function cloudInit() {
  if (cloudDb) return cloudDb;
  try {
    if (!window.firebase.apps || !window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
    cloudDb = window.firebase.firestore();
  } catch (e) { console.error("cloud init failed", e); }
  return cloudDb;
}
let cloudStorageRef = null;
function cloudInitStorage() {
  if (cloudStorageRef) return cloudStorageRef;
  try {
    if (!window.firebase.apps || !window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
    cloudStorageRef = window.firebase.storage();
  } catch (e) { console.error("storage init failed", e); }
  return cloudStorageRef;
}
function dataUrlToBlob(dataUrl) {
  const parts = dataUrl.split(",");
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  const arr = new Uint8Array(bstr.length);
  for (let i = 0; i < bstr.length; i++) arr[i] = bstr.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function uploadPhotoToStorage(dataUrl, onDone) {
  const linkId = cloudGetLinkId();
  const storage = cloudInitStorage();
  if (!linkId || !storage) { onDone(dataUrl, false); return; } // مفيش مزامنة مفعّلة -> خزّنها محليًا زي القديم
  try {
    const blob = dataUrlToBlob(dataUrl);
    const path = `photos/${linkId}/${uid()}.jpg`;
    const ref = storage.ref(path);
    ref.put(blob).then((snap) => snap.ref.getDownloadURL()).then((url) => onDone(url, true)).catch((e) => {
      console.error("photo upload failed", e);
      onDone(dataUrl, false); // فشل الرفع -> ارجع للتخزين المحلي بدل ما تضيع الصورة
    });
  } catch (e) {
    console.error("photo upload failed", e);
    onDone(dataUrl, false);
  }
}
// بيرفع الصورة في الخلفية من غير ما يوقّف حفظ الفاتورة، وبيحدّث السجل بالرابط النهائي أول ما يخلص
function uploadPhotoInBackground(recordKey, recordId, localDataUrl) {
  uploadPhotoToStorage(localDataUrl, (finalUrl, uploaded) => {
    if (!uploaded) return; // فشل الرفع -> سيب الصورة المحلية زي ما هي، مفيش داعي نلمس السجل
    const arr = loadKey(recordKey, []) || [];
    const idx = arr.findIndex((x) => x.id === recordId);
    if (idx === -1) return; // اتحذفت الفاتورة أو اتعدلت قبل ما الرفع يخلص
    arr[idx] = { ...arr[idx], photo: finalUrl };
    saveKey(recordKey, arr);
    if (DB[recordKey]) DB[recordKey] = arr;
    if (state.modal) render(); // حدّث الشاشة لو المستخدم لسه واقف عليها
  });
}
function cloudGetLinkId() { return loadKey("cloudLinkId", null); }
function cloudSetLinkId(id) { try { localStorage.setItem(LS_PREFIX + "cloudLinkId", JSON.stringify(id)); } catch (e) {} }
function cloudIsEnabled() { return !!cloudGetLinkId(); }

const ACCOUNT_SCOPED_KEYS = ["products", "suppliers", "customers", "purchases", "sales", "expenses", "vouchers", "manualCash", "checks", "capital", "warehouses", "warehouseEntries", "employees", "employeeTx", "damagedGoods"];
function cloudSnapshotRoot() {
  return { accounts: loadKey("accounts", []), cloudOwnerPin: loadKey("cloudOwnerPin", null), _updatedAt: Date.now() };
}
function cloudSnapshotAccount(accountId) {
  const snap = {};
  ACCOUNT_SCOPED_KEYS.forEach((k) => { snap[k] = (loadKey(k, []) || []).filter((x) => x.accountId === accountId); });
  const settingsMap = loadKey("settingsMap", {}) || {};
  snap.settings = settingsMap[accountId] || null;
  snap.reps = (loadKey("reps", []) || []).filter((r) => r.accountId === accountId);
  const myRepIds = new Set(snap.reps.map((r) => r.id));
  snap.cashHandovers = (loadKey("cashHandovers", []) || []).filter((h) => myRepIds.has(h.repId));
  snap._updatedAt = Date.now();
  return snap;
}
function cloudSnapshotAll() {
  // بيرجع نسخة قديمة (متضمنة كل الحسابات مع بعض) — لسه مستخدمة في التصدير/الاستيراد المحلي بس، مش في الرفع للسحابة
  const snap = {};
  BACKUP_KEYS.forEach((k) => { snap[k] = loadKey(k, null); });
  snap._updatedAt = Date.now();
  return snap;
}
function cloudScheduleSync() {
  if (!cloudIsEnabled() || cloudApplyingRemote || cloudSyncBlocked) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(cloudPushNow, 900);
}
function cloudPushNow() {
  if (cloudSyncBlocked) return;
  const db = cloudInit();
  const linkId = cloudGetLinkId();
  if (!db || !linkId || !state.activeAccountId) return;
  const rootRef = db.collection("daftar_accounts").doc(linkId);
  const accountRef = rootRef.collection("data").doc(state.activeAccountId);
  Promise.all([
    rootRef.set(cloudSnapshotRoot(), { merge: false }),
    accountRef.set(cloudSnapshotAccount(state.activeAccountId), { merge: false }),
  ])
    .then(() => { cloudPushFailed = false; })
    .catch((e) => {
      console.error("cloud push failed", e);
      cloudPushFailed = true;
      const sizeIssue = e && (e.code === "invalid-argument" || /size|exceed|too large|too big/i.test(e.message || ""));
      flash(sizeIssue
        ? "❌ فشلت المزامنة! حجم البيانات كبير جدًا (غالبًا بسبب الصور القديمة) — لازم نصغّرها"
        : "❌ فشلت المزامنة مع السحابة — تأكد من الاتصال بالإنترنت");
    });
}
let cloudPushFailed = false;
let recentlyAddedGuard = []; // {key, id, item, ts} — حماية إضافية لأي سجل جديد لمدة 45 ثانية بعد إضافته
const RECENT_GUARD_MS = 45000;
function protectRecentlyAdded(key, item) {
  recentlyAddedGuard.push({ key, id: item.id, item, ts: Date.now() });
  recentlyAddedGuard = recentlyAddedGuard.filter((r) => Date.now() - r.ts < RECENT_GUARD_MS);
}
function cloudApplySnapshot(kind, accountId, data) {
  if (!data) return;
  // لو الجهاز عنده تعديل محلي أحدث من نسخة السحابة دي، تجاهلها عشان ما تمسحش التعديل الحديث
  if (data._updatedAt && data._updatedAt < localLastModifiedAt) return;
  // لو المستخدم لسه بيبني فاتورة (سلة فيها أصناف) أو واقف في نافذة إدخال بيانات، أجّل التحديث عشان ما نقطعش شغله
  const cartBusy = (state.cart && state.cart.length > 0) || (state.pcart && state.pcart.length > 0);
  const modalBusy = state.modal && ["saleCart", "purchaseCart", "repCollect", "repHandover"].includes(state.modal.type);
  if (cartBusy || modalBusy) { pendingCloudSnapshots.push({ kind, accountId, data }); return; }
  cloudApplyingRemote = true;
  try {
    if (kind === "root") {
      if (data.accounts !== undefined) localStorage.setItem(LS_PREFIX + "accounts", JSON.stringify(data.accounts));
      if (data.cloudOwnerPin !== undefined) localStorage.setItem(LS_PREFIX + "cloudOwnerPin", JSON.stringify(data.cloudOwnerPin));
    } else {
      // نسخة حساب واحد بس — لازم نستبدل سجلات الحساب ده بالذات جوه كل مفتاح، من غير ما نلمس بيانات أي حساب تاني
      ACCOUNT_SCOPED_KEYS.forEach((k) => {
        const current = loadKey(k, []) || [];
        const others = current.filter((x) => x.accountId !== accountId);
        const mine = data[k] || [];
        localStorage.setItem(LS_PREFIX + k, JSON.stringify([...others, ...mine]));
      });
      const settingsMap = loadKey("settingsMap", {}) || {};
      if (data.settings) settingsMap[accountId] = data.settings;
      localStorage.setItem(LS_PREFIX + "settingsMap", JSON.stringify(settingsMap));
      const repsAll = loadKey("reps", []) || [];
      const repsOthers = repsAll.filter((r) => r.accountId !== accountId);
      localStorage.setItem(LS_PREFIX + "reps", JSON.stringify([...repsOthers, ...(data.reps || [])]));
      const myNewRepIds = new Set((data.reps || []).map((r) => r.id));
      const handoversAll = loadKey("cashHandovers", []) || [];
      const handoversOthers = handoversAll.filter((h) => !myNewRepIds.has(h.repId));
      localStorage.setItem(LS_PREFIX + "cashHandovers", JSON.stringify([...handoversOthers, ...(data.cashHandovers || [])]));
    }
    // حماية إضافية: أي سجل حديث (آخر 45 ثانية) لازم يفضل موجود حتى لو النسخة الجديدة مش فيها
    recentlyAddedGuard = recentlyAddedGuard.filter((r) => Date.now() - r.ts < RECENT_GUARD_MS);
    let restoredAny = false;
    recentlyAddedGuard.forEach((r) => {
      const arr = loadKey(r.key, []) || [];
      if (!arr.some((x) => x.id === r.id)) {
        arr.unshift(r.item);
        try { localStorage.setItem(LS_PREFIX + r.key, JSON.stringify(arr)); } catch (e) {}
        restoredAny = true;
      }
    });
    bootDB();
    if (restoredAny) cloudScheduleSync();
    render();
  } finally {
    cloudApplyingRemote = false;
  }
}
let pendingCloudSnapshots = [];
// يطبّق أي تحديثات سحابة كانت متأجّلة، بعد ما المستخدم يخلص شغله (يقفل النافذة أو يفضي السلة)
function applyPendingCloudSnapshotIfSafe() {
  if (pendingCloudSnapshots.length === 0) return;
  const cartBusy = (state.cart && state.cart.length > 0) || (state.pcart && state.pcart.length > 0);
  const modalBusy = state.modal && ["saleCart", "purchaseCart", "repCollect", "repHandover"].includes(state.modal.type);
  if (cartBusy || modalBusy) return;
  const pending = pendingCloudSnapshots;
  pendingCloudSnapshots = [];
  pending.forEach((p) => cloudApplySnapshot(p.kind, p.accountId, p.data));
}
function cloudStartListening() {
  const db = cloudInit();
  const linkId = cloudGetLinkId();
  if (!db || !linkId) return;
  if (cloudUnsub) { cloudUnsub.forEach((u) => u()); }
  cloudUnsub = [];
  const rootRef = db.collection("daftar_accounts").doc(linkId);
  cloudUnsub.push(rootRef.onSnapshot((doc) => {
    if (doc.exists) cloudApplySnapshot("root", null, doc.data());
  }, (e) => console.error("cloud listen failed (root)", e)));
  cloudListenToAccount(state.activeAccountId);
}
function cloudListenToAccount(accountId) {
  if (!accountId) return;
  const db = cloudInit();
  const linkId = cloudGetLinkId();
  if (!db || !linkId) return;
  if (cloudAccountUnsub) cloudAccountUnsub();
  cloudAccountUnsub = db.collection("daftar_accounts").doc(linkId).collection("data").doc(accountId).onSnapshot((doc) => {
    if (doc.exists) cloudApplySnapshot("account", accountId, doc.data());
  }, (e) => console.error("cloud listen failed (account)", e));
}
let cloudAccountUnsub = null;
function cloudGetOwnerPin() { return loadKey("cloudOwnerPin", null); }

async function cloudTryLogin(linkId, pin) {
  const db = cloudInit();
  if (!db) { flash("تعذّر الاتصال بالسحابة"); return false; }
  try {
    const rootRef = db.collection("daftar_accounts").doc(linkId);
    const doc = await rootRef.get();
    if (!doc.exists) { flash("الرمز غير صحيح — تأكد من الرمز اللي أعطاك إياه صاحب الشركة"); return false; }
    const rootData = doc.data();
    if (rootData.cloudOwnerPin && pin === rootData.cloudOwnerPin) {
      cloudSetLinkId(linkId);
      sessionStorage.setItem("daftar_isOwner", "1");
      sessionStorage.removeItem("daftar_repId");
      cloudApplySnapshot("root", null, rootData);
      const accounts = rootData.accounts || [];
      const targetId = accounts.length ? accounts[0].id : null;
      if (targetId) {
        const accDoc = await rootRef.collection("data").doc(targetId).get();
        if (accDoc.exists) cloudApplySnapshot("account", targetId, accDoc.data());
        state.activeAccountId = targetId;
      }
      cloudStartListening();
      return true;
    }
    // مش صاحب الشركة -> دور على مندوب بنفس الرقم السري في أي حساب (لازم نفحص كل حساب لحاله)
    const accounts = rootData.accounts || [];
    for (const acc of accounts) {
      const accDoc = await rootRef.collection("data").doc(acc.id).get();
      if (!accDoc.exists) continue;
      const accData = accDoc.data();
      const rep = (accData.reps || []).find((r) => r.pin === pin);
      if (rep) {
        cloudSetLinkId(linkId);
        sessionStorage.setItem("daftar_repId", rep.id);
        sessionStorage.removeItem("daftar_isOwner");
        cloudApplySnapshot("root", null, rootData);
        cloudApplySnapshot("account", acc.id, accData);
        state.activeAccountId = acc.id;
        cloudStartListening();
        return true;
      }
    }
    flash("الرقم السري غير صحيح");
    return false;
  } catch (e) {
    console.error(e);
    flash("حصل خطأ (" + (e && e.message ? e.message : "غير معروف") + ") — تأكد من الاتصال بالإنترنت");
    return false;
  }
}

/* ===================== BACKUP / RESTORE ===================== */
const BACKUP_KEYS = ["accounts", "products", "suppliers", "customers", "purchases", "sales", "expenses", "vouchers", "manualCash", "checks", "capital", "warehouses", "warehouseEntries", "employees", "employeeTx", "settingsMap", "reps", "cashHandovers", "cloudOwnerPin", "damagedGoods"];
function exportBackup() {
  const payload = { app: "daftar", version: 1, exportedAt: new Date().toISOString() };
  BACKUP_KEYS.forEach((k) => { payload[k] = DB[k]; });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `daftar-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash("تم تصدير النسخة الاحتياطية");
}
function triggerImport() { document.getElementById("backup-file-input").click(); }
function importBackupFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { applyBackupPayload(e.target.result); };
  reader.readAsText(file);
  input.value = "";
}
function applyBackupPayload(rawText) {
  try {
    const payload = JSON.parse(rawText);
    if (!payload || payload.app !== "daftar" || !Array.isArray(payload.accounts)) {
      flash("النص/الملف غير صالح");
      return;
    }
    BACKUP_KEYS.forEach((k) => { DB[k] = payload[k] || (k === "settingsMap" ? {} : []); persist(k); });
    state.activeAccountId = null;
    state.screen = "home";
    state.modal = null;
    flash("تم استيراد النسخة الاحتياطية بنجاح");
    render();
  } catch (err) {
    flash("تعذّر قراءة النص — تأكد إنه منسوخ كامل");
  }
}
function openImportTextModal() { state.modal = { type: "importText" }; render(); }
function submitImportText() {
  const txt = document.getElementById("import-text-area").value.trim();
  if (!txt) return;
  applyBackupPayload(txt);
}

function customerBalance(c) {
  const salesTotal = scoped("sales").filter((s) => s.customerId === c.id).reduce((a, s) => a + (s.total - s.paidNow), 0);
  const paid = scoped("vouchers").filter((v) => v.partyKind === "customer" && v.partyId === c.id).reduce((a, v) => a + v.amount, 0);
  return (c.opening || 0) + salesTotal - paid;
}
function supplierBalance(s0) {
  const purTotal = scoped("purchases").filter((p) => p.supplierId === s0.id).reduce((a, p) => a + (p.total - p.paidNow), 0);
  const paid = scoped("vouchers").filter((v) => v.partyKind === "supplier" && v.partyId === s0.id).reduce((a, v) => a + v.amount, 0);
  return (s0.opening || 0) + purTotal - paid;
}
function cashLedger() {
  const settings = currentSettings();
  const entries = [];
  if (settings.autoSales) {
    scoped("sales").forEach((s) => { if (s.paidNow > 0 && !s.checkPayment && !s.repId) entries.push({ id: "s" + s.id, ts: s.ts, type: "in", amount: s.paidNow, desc: `مبيعات فاتورة #${shortId(s.id)}`, source: "sale" }); });
    scoped("vouchers").filter((v) => v.partyKind === "customer" && v.method !== "check" && !v.repId).forEach((v) => {
      const cashPart = typeof v.cashAmount === "number" ? v.cashAmount : v.amount;
      if (cashPart > 0) entries.push({ id: "v" + v.id, ts: v.ts, type: "in", amount: cashPart, desc: `تحصيل: ${v.partyName}`, source: "receipt" });
    });
  }
  if (settings.autoPurchases) {
    scoped("purchases").forEach((p) => { if (p.paidNow > 0) entries.push({ id: "p" + p.id, ts: p.ts, type: "out", amount: p.paidNow, desc: `مشتريات فاتورة #${shortId(p.id)}`, source: "purchase" }); });
    scoped("vouchers").filter((v) => v.partyKind === "supplier" && v.method !== "check").forEach((v) => entries.push({ id: "v" + v.id, ts: v.ts, type: "out", amount: v.amount, desc: `دفع: ${v.partyName}`, source: "payment" }));
  }
  if (settings.autoExpenses) {
    scoped("expenses").filter((e) => e.method === "cashbox").forEach((e) => entries.push({ id: "e" + e.id, ts: e.ts, type: "out", amount: e.amount, desc: `مصروف: ${e.account}`, source: "expense" }));
  }
  scoped("manualCash").forEach((m) => entries.push({ id: "m" + m.id, ts: m.ts, type: m.type, amount: m.amount, desc: m.desc || "حركة يدوية", source: "manual" }));
  entries.sort((a, b) => new Date(b.ts) - new Date(a.ts));
  return entries;
}
function cashBalance() { return cashLedger().reduce((a, e) => a + (e.type === "in" ? e.amount : -e.amount), 0); }

/* ===================== RENDER ROOT ===================== */
function render() {
  // preserve focus + cursor + scroll position across the full innerHTML re-render,
  // otherwise typing in any input loses focus (and closes the keyboard on mobile) every keystroke.
  const active = document.activeElement;
  const activeId = active && active.id;
  let selStart = null, selEnd = null;
  try {
    selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  } catch (e) { /* type="text" inputmode="decimal" inputs throw when reading selection — ignore, just skip cursor restore */ }
  const scrollY = window.scrollY;
  // النوافذ (زي فاتورة البيع) عندها تمرير داخلي خاص بيها، منفصل عن تمرير الصفحة —
  // لازم نحفظه ونرجّعه برضه، وإلا كل حرف بتكتبه بيرجّع النافذة لأولها من غير قصد
  const modalBoxBefore = document.querySelector(".modal-box");
  const modalScrollTop = modalBoxBefore ? modalBoxBefore.scrollTop : null;

  renderFlashOnly();
  const app = document.getElementById("app");
  if (state.isRepEntry) {
    app.innerHTML = isOwnerCloudSession() ? (renderHeader() + `<main class="app-main">${renderScreen()}</main>` + renderFloatingBar() + renderModal())
      : currentRepId() ? renderRepDashboard() : renderRepLogin();
  } else if (!state.activeAccountId) {
    app.innerHTML = renderAccountsHeader() + `<main class="app-main">${renderAccountsScreen()}</main>` + renderModal();
  } else {
    app.innerHTML = renderHeader() + `<main class="app-main">${renderScreen()}</main>` + renderFloatingBar() + renderModal();
  }
  afterRenderHooks();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT")) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
  window.scrollTo(0, scrollY);
  if (modalScrollTop !== null) {
    const modalBoxAfter = document.querySelector(".modal-box");
    if (modalBoxAfter) modalBoxAfter.scrollTop = modalScrollTop;
  }
}
function afterRenderHooks() {
  if (state.modal && state.modal.type === "scan" && !state.modal._started) {
    state.modal._started = true;
    startScanner(state.modal.onDetect);
  }
}

function repOpenHandover() {

function repHandoverModalHtml() {
  const rep = currentRep();
  if (!rep) return "";
  const settings = currentSettings();
  const mySales = scoped("sales").filter((s) => s.repId === rep.id);
  const myVouchers = scoped("vouchers").filter((v) => v.repId === rep.id);
  const todayStr0 = new Date().toDateString();
  const cashSalesToday = mySales.filter((s) => s.payType === "cash" && new Date(s.ts).toDateString() === todayStr0).reduce((a, s) => a + s.paidNow, 0);
  const cashVouchersToday = myVouchers.filter((v) => v.method !== "check" && new Date(v.ts).toDateString() === todayStr0).reduce((a, v) => a + (v.cashAmount ?? v.amount), 0);
  const myHandoversToday = (loadKey("cashHandovers", []) || []).filter((h) => h.repId === rep.id && new Date(h.ts).toDateString() === todayStr0 && h.status !== "rejected");
  const handedOverToday = myHandoversToday.reduce((a, h) => a + h.amount, 0);
  const cashToday = cashSalesToday + cashVouchersToday - handedOverToday;
  return `<div class="modal-title-row"><h3>📤 تسليم الكاش</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="card" style="padding:16px;text-align:center;background:var(--greenLight);margin-bottom:14px;">
      <div class="row-sub">المبلغ اللي معاك دلوقتي</div>
      <div class="mono" style="font-weight:700;font-size:26px;color:var(--green);">${fmt(cashToday)} ${esc(settings.currency)}</div>
    </div>
    <div class="row-sub" style="margin-bottom:14px;">بعد ما تدوس تأكيد، هيوصل طلب لصاحب الشركة إنك سلّمته ${fmt(cashToday)} دينار كاش — وهو اللي هيأكّد استلامه.</div>
    <button class="btn btn-green btn-block" onclick="repSubmitHandover(${cashToday})">تأكيد طلب التسليم</button>`;
}
function repSubmitHandover(amount) {
  const rep = currentRep();
  if (!rep || amount <= 0) { flash("مفيش كاش تسلمه دلوقتي"); return; }
  const handovers = loadKey("cashHandovers", []) || [];
  handovers.push({ id: uid(), repId: rep.id, repName: rep.name, amount, ts: new Date().toISOString(), status: "pending" });
  saveKey("cashHandovers", handovers);
  flash("تم إرسال طلب التسليم — في انتظار تأكيد صاحب الشركة");
  closeModal();
}
function confirmHandover(handoverId) {
  const handovers = loadKey("cashHandovers", []) || [];
  const h = handovers.find((x) => x.id === handoverId);
  if (!h || h.status !== "pending") return;
  h.status = "confirmed"; h.confirmedAt = new Date().toISOString();
  saveKey("cashHandovers", handovers);
  addScoped("manualCash", { id: uid(), ts: new Date().toISOString(), type: "in", amount: h.amount, desc: `تسليم كاش من المندوب: ${h.repName}` });
  flash(`تم تأكيد استلام ${fmt(h.amount)} من ${h.repName}`);
  render();
}
function rejectHandover(handoverId) {
  const handovers = loadKey("cashHandovers", []) || [];
  const h = handovers.find((x) => x.id === handoverId);
  if (!h) return;
  h.status = "rejected";
  saveKey("cashHandovers", handovers);
  flash("تم رفض الطلب");
  render();
}

function productPickerResultsHtml(products, query, opts) {
  const q = (query || "").toLowerCase();
  const filtered = products.filter((p) => p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q) || (p.barcode || "").includes(query || ""));
  let html = "";
  if (query && filtered.length === 0 && opts.showAddNew) {
    html += `<button class="btn btn-gold btn-block" style="text-align:right;margin-bottom:10px;" onclick="openNewItemModal('${esc(query).replace(/'/g, "\\'")}','','${opts.addFn === "addToCart" ? "sale" : "purchase"}')">+ إضافة "${esc(query)}" كصنف جديد على الفاتورة</button>`;
  }
  if (filtered.length === 0) { html += emptyState(query ? "لا يوجد صنف بهذا الاسم" : "لا توجد أصناف بعد"); return html; }

  const byCategory = {};
  filtered.forEach((p) => { const cat = p.category || "بدون تصنيف"; (byCategory[cat] = byCategory[cat] || []).push(p); });

  html += `<div class="card" style="max-height:400px;overflow-y:auto;padding:0;margin-bottom:14px;">`;
  Object.entries(byCategory).forEach(([cat, items]) => {

  return html;

function playAddSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!window._daftarAudioCtx) window._daftarAudioCtx = new AudioCtx();
    const ctx = window._daftarAudioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime;
    const notes = [[880, now, 0.09], [1318.5, now + 0.07, 0.13]]; // "تيك" قصيرة بنغمتين زي صوت كاشير خفيف
    notes.forEach(([freq, start, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    });
  } catch (e) { /* لو المتصفح رفض الصوت لأي سبب، تجاهله بهدوء من غير ما يكسر الإضافة */ }
}
