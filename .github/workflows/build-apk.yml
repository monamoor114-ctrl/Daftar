name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply custom native overrides
        run: |
          cp native-overrides/MainActivity.java android/app/src/main/java/com/natsheh/daftar/MainActivity.java
          cp native-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Apply custom app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$d"
            cp icon-512.png "$d/ic_launcher.png"
            cp icon-512.png "$d/ic_launcher_round.png"
          done

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore fixed debug keystore (so every build has the same signature)
        run: |
          mkdir -p ~/.android
          base64 -d debug-keystore.base64.txt > ~/.android/debug.keystore

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
