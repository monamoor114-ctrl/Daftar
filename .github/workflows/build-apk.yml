name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply custom native overrides
        run: |
          cp native-overrides/MainActivity.java android/app/src/main/java/com/natsheh/daftar/MainActivity.java
          cp native-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Set version code from run number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Apply custom app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            mkdir -p "$d"
            cp icon-512.png "$d/ic_launcher.png"
            cp icon-512.png "$d/ic_launcher_round.png"
          done

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ط§ظ„ظ…ظپطھط§ط­ ط§ظ„ط«ط§ط¨طھ: ط¨ظ†ط­ط·ظ‡ ط¬ظˆظ‘ط§ ط§ظ„ظ…ط´ط±ظˆط¹ ظˆط¨ظ†ط¬ط¨ط± Gradle ظٹظˆظ‚ظ‘ط¹ ظپظٹظ‡ طµط±ط§ط­ط©طŒ
      # ط¹ط´ط§ظ† ظƒظ„ ظ†ط³ط®ط© طھط·ظ„ط¹ ط¨ظ†ظپط³ ط§ظ„طھظˆظ‚ظٹط¹ ظˆطھط±ظƒط¨ ظƒطھط­ط¯ظٹط« ظپظˆظ‚ ط§ظ„ظ‚ط¯ظٹظ…ط©
      - name: Use fixed signing key
        run: |
          base64 -d debug-keystore.base64.txt > android/app/daftar-debug.keystore
          mkdir -p ~/.android
          cp android/app/daftar-debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('daftar-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      # ط¨ظٹط·ط¨ط¹ ط¨طµظ…ط© ط§ظ„طھظˆظ‚ظٹط¹ ط¨ط³ط¬ظ„ ط§ظ„ط¨ظ†ط§ط،طŒ ظ„ط§ط²ظ… طھط·ظ„ط¹ ظ†ظپط³ظ‡ط§ ط¨ظƒظ„ ط¨ظ†ط§ط،
      - name: Show signing fingerprint
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daftar-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
